# fly.toml app configuration file generated for kuki-pos on 2026-05-26T07:31:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kuki-pos'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/shop.db'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'shop_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

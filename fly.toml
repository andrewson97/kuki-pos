app = "kuki-pos"
# Mumbai (bom) is deprecated on fly.io and cannot take new resources.
# Singapore is the nearest region to the shop: ~3,400 km from Colombo
# against ~8,100 km to Amsterdam, where this used to run.
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/shop.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "shop_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

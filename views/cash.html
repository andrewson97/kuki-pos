<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Drawer - KUKI POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <h5 class="mb-0">Cash Drawer</h5>
      <div id="top-bar-user"></div>
    </div>
    <div class="content-area">
      <div id="today-status" class="mb-4"></div>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="table-container p-3">
            <h6 class="fw-bold mb-3" id="form-title">Opening Float</h6>
            <div id="denominations"></div>
            <div class="row align-items-center mb-2">
              <div class="col-3"><strong>Coins</strong></div>
              <div class="col-4"><input type="number" min="0" step="any" class="form-control" id="coins_total" value="0" oninput="recalc()" aria-label="Coins total (Rs)"></div>
              <div class="col-2 text-muted text-center small">total (Rs)</div>
              <div class="col-3 text-end" id="line_coins">Rs. 0.00</div>
            </div>
            <hr>
            <div class="d-flex justify-content-between fs-5"><span>Counted Total:</span><strong id="counted-total">Rs. 0.00</strong></div>
            <div id="expected-block" class="mt-2" style="display:none;">
              <div class="d-flex justify-content-between"><span class="text-muted">Opening Float:</span><span id="opening-amt">-</span></div>
              <div class="d-flex justify-content-between"><span class="text-muted">+ Cash Sales:</span><span id="sales-amt">-</span></div>
              <div class="d-flex justify-content-between"><span class="text-muted">- Cash Refunds:</span><span id="refunds-amt">-</span></div>
              <div class="d-flex justify-content-between"><span class="text-muted">- Cash Expenses:</span><span id="expenses-amt">-</span></div>
              <div class="d-flex justify-content-between"><span class="text-muted">+ Deposits taken (cash):</span><span id="deposits-taken-amt">-</span></div>
              <div class="d-flex justify-content-between"><span class="text-muted">- Deposits applied at collection:</span><span id="deposits-applied-amt">-</span></div>
              <div class="justify-content-between d-none" id="deposits-refunded-row"><span class="text-muted">- Deposits refunded (cash):</span><span id="deposits-refunded-amt">-</span></div>
              <div class="d-flex justify-content-between fw-bold"><span>Expected:</span><span id="expected-amt">-</span></div>
              <div class="d-flex justify-content-between fs-5 mt-2"><span>Variance:</span><strong id="variance-amt">-</strong></div>
            </div>
            <div id="pending-warning" class="alert alert-warning mt-2" style="display:none;"></div>
            <div class="mt-3">
              <label class="form-label">Notes <small class="text-muted">(optional)</small></label>
              <textarea class="form-control" id="count-notes" rows="2" placeholder="e.g., found Rs.100 on floor"></textarea>
            </div>
            <button class="btn btn-primary w-100 mt-3" id="submit-btn" onclick="submitCount(this)">Save Opening Float</button>
          </div>
        </div>
        <div class="col-md-6">
          <div class="table-container p-3">
            <h6 class="fw-bold mb-3">History</h6>
            <table class="table table-sm">
              <thead><tr><th>Date</th><th>Type</th><th>By</th><th class="text-end">Counted</th><th class="text-end">Variance</th></tr></thead>
              <tbody id="history-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    const DENOMS = [5000, 2000, 1000, 500, 100, 50, 20];
    let mode = 'open';
    let todayData = null;

    initApp('/cash', loadCash);

    function renderDenomInputs() {
      const html = DENOMS.map(d => `
        <div class="row align-items-center mb-2">
          <div class="col-3"><strong>Rs. ${d}</strong></div>
          <div class="col-4"><input type="number" min="0" step="1" class="form-control denom-input" id="notes_${d}" data-denom="${d}" value="0" oninput="recalc()"></div>
          <div class="col-2 text-muted text-center">×</div>
          <div class="col-3 text-end" id="line_${d}">Rs. 0.00</div>
        </div>
      `).join('');
      document.getElementById('denominations').innerHTML = html;
    }

    // Money is compared to the cent. Floats summed in the browser leave tails
    // like 4999.999999, so `variance === 0` called an exact count "short".
    function money(n) { return Math.round((Number(n) || 0) * 100) / 100; }
    function isNil(v) { return Math.abs(Number(v) || 0) < 0.005; }
    function varianceClass(v) { return isNil(v) ? 'text-success' : (v > 0 ? 'text-warning' : 'text-danger'); }
    function signedCurrency(v) { return isNil(v) ? formatCurrency(0) : (v > 0 ? '+' : '') + formatCurrency(v); }

    function coinsValue() {
      const v = parseFloat(document.getElementById('coins_total').value);
      return Number.isFinite(v) && v > 0 ? money(v) : 0;
    }

    function recalc() {
      let total = 0;
      DENOMS.forEach(d => {
        const count = parseInt(document.getElementById(`notes_${d}`).value) || 0;
        const line = count * d;
        total += line;
        document.getElementById(`line_${d}`).textContent = formatCurrency(line);
      });
      const coins = coinsValue();
      document.getElementById('line_coins').textContent = formatCurrency(coins);
      total = money(total + coins);
      document.getElementById('counted-total').textContent = formatCurrency(total);

      // Variance against the SERVER's expected figure (expected_now), never one
      // re-derived here: the browser used to leave the pre-order deposits out,
      // so the screen and the stored close disagreed on any day with a deposit.
      if (mode === 'close' && todayData) {
        const variance = money(total - (todayData.expected_now || 0));
        const vEl = document.getElementById('variance-amt');
        vEl.textContent = signedCurrency(variance);
        vEl.className = varianceClass(variance);
      }
    }

    function setMode(newMode) {
      mode = newMode;
      const submitBtn = document.getElementById('submit-btn');
      const formTitle = document.getElementById('form-title');
      const expectedBlock = document.getElementById('expected-block');

      submitBtn.style.display = 'block';
      document.querySelectorAll('.denom-input').forEach(i => { i.disabled = false; i.value = 0; });
      document.getElementById('coins_total').value = 0;
      document.getElementById('count-notes').disabled = false;
      document.getElementById('count-notes').value = '';

      if (mode === 'open') {
        formTitle.textContent = todayData.close ? 'Open New Shift' : 'Opening Float';
        submitBtn.className = 'btn btn-primary w-100 mt-3';
        expectedBlock.style.display = 'none';
      } else if (mode === 'close') {
        formTitle.textContent = 'Closing Count';
        submitBtn.className = 'btn btn-success w-100 mt-3';
        expectedBlock.style.display = 'block';
        document.getElementById('opening-amt').textContent = formatCurrency(todayData.open?.total_amount || 0);
        document.getElementById('sales-amt').textContent = formatCurrency(todayData.cash_sales || 0);
        document.getElementById('refunds-amt').textContent = formatCurrency(todayData.cash_refunds || 0);
        document.getElementById('expenses-amt').textContent = formatCurrency(todayData.cash_expenses || 0);
        document.getElementById('deposits-taken-amt').textContent = formatCurrency(todayData.deposits_taken || 0);
        document.getElementById('deposits-applied-amt').textContent = formatCurrency(todayData.deposits_applied || 0);
        // Only shown when the server reports it (cash handed back for a
        // cancelled pre-order). Either way it is already inside expected_now.
        const hasRefunded = todayData.deposits_refunded !== undefined && todayData.deposits_refunded !== null;
        document.getElementById('deposits-refunded-row').classList.toggle('d-none', !hasRefunded);
        document.getElementById('deposits-refunded-row').classList.toggle('d-flex', hasRefunded);
        if (hasRefunded) document.getElementById('deposits-refunded-amt').textContent = formatCurrency(todayData.deposits_refunded);
        // The server's figure, shown as-is: the lines above explain it, they are
        // not added up again here.
        document.getElementById('expected-amt').textContent = formatCurrency(todayData.expected_now || 0);
      }
      updateSubmitState();
      recalc();
    }

    // Single owner of #submit-btn's label and enabled state: a closing count is
    // blocked while any expense is still waiting for admin approval. withBusy()
    // re-enables and relabels the button unconditionally in its finally, so
    // submitCount() calls this again afterwards to re-assert the real state.
    function updateSubmitState() {
      const submitBtn = document.getElementById('submit-btn');
      const pendWarn = document.getElementById('pending-warning');
      const blocked = mode === 'close' && (todayData?.pending_expenses || 0) > 0;
      if (blocked) {
        pendWarn.textContent = `${todayData.pending_expenses} expense(s) pending admin approval. Shift cannot be closed until they are approved or rejected.`;
        pendWarn.style.display = 'block';
      } else {
        pendWarn.style.display = 'none';
      }
      submitBtn.textContent = mode === 'close'
        ? 'Save Closing Count'
        : (todayData?.close ? 'Open New Shift' : 'Save Opening Float');
      submitBtn.disabled = blocked;
    }

    async function loadCash() {
      renderDenomInputs();
      todayData = await api('/api/cash/today');
      renderTodayStatus();

      // shift_open: a shift is currently active and can be closed.
      // !shift_open: either no open today, or last shift already closed → ready to open a new one.
      if (todayData.shift_open) setMode('close');
      else setMode('open');

      const history = await api('/api/cash/history?limit=30');
      document.getElementById('history-table').innerHTML = history.map(h => `
        <tr>
          <td>${formatDate(h.count_date)}</td>
          <td><span class="badge bg-${h.count_type === 'open' ? 'primary' : 'success'}">${h.count_type}</span></td>
          <td>${h.user_name || '-'}</td>
          <td class="text-end">${formatCurrency(h.total_amount)}</td>
          <td class="text-end ${h.variance == null ? '' : varianceClass(h.variance)}">${h.variance == null ? '-' : signedCurrency(h.variance)}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="text-center text-muted py-3">No records yet</td></tr>';
    }

    function renderTodayStatus() {
      const status = document.getElementById('today-status');
      if (!todayData.open) {
        status.innerHTML = `<div class="alert alert-info">No opening float recorded for today yet. Enter the cash count to start the day.</div>`;
      } else if (todayData.shift_from_prior_day) {
        status.innerHTML = `<div class="alert alert-danger"><strong>&#9888;&#65039; Shift from ${formatDate(todayData.open.count_date)} still open.</strong> The shift opened by ${todayData.open.user_name} on ${formatDate(todayData.open.count_date)} at ${formatTime(todayData.open.created_at)} was never closed. Count the drawer now and close it below before taking any new sales today.</div>`;
      } else if (todayData.shift_open) {
        status.innerHTML = `<div class="alert alert-warning">Shift in progress — opening float of <strong>${formatCurrency(todayData.open.total_amount)}</strong> recorded by ${todayData.open.user_name} at ${formatTime(todayData.open.created_at)}. Count cash again to close this shift.</div>`;
      } else {
        // The STORED close: expected_amount and variance exactly as the server
        // worked them out when the shift was closed.
        const v = Number(todayData.close.variance) || 0;
        const cls = isNil(v) ? 'success' : (v > 0 ? 'warning' : 'danger');
        const word = isNil(v) ? 'matched exactly' : `${v > 0 ? 'over by' : 'short by'} ${formatCurrency(Math.abs(v))}`;
        const expectedTxt = todayData.close.expected_amount == null ? '' : ` against ${formatCurrency(todayData.close.expected_amount)} expected`;
        status.innerHTML = `<div class="alert alert-${cls}">Last shift closed at ${formatTime(todayData.close.created_at)} — counted ${formatCurrency(todayData.close.total_amount)}${expectedTxt}, ${word}. You can open a new shift below if needed.</div>`;
      }
    }

    async function submitCount(btn) {
      const body = { notes: document.getElementById('count-notes').value };
      DENOMS.forEach(d => body[`notes_${d}`] = parseInt(document.getElementById(`notes_${d}`).value) || 0);
      body.coins_total = coinsValue();
      await withBusy(btn, async () => {
        const res = await api(`/api/cash/${mode}`, { method: 'POST', body });
        if (mode === 'open') {
          showToast('Opening float saved');
        } else {
          // Quote the close the server stored, not the figure on screen a moment
          // ago: a sale rung up while the drawer was being counted moves it.
          const v = Number(res.variance) || 0;
          showToast(`Closing count saved — expected ${formatCurrency(res.expected_amount)}, ` +
            (isNil(v) ? 'matched exactly' : `${v > 0 ? 'over' : 'short'} by ${formatCurrency(Math.abs(v))}`));
        }
        await loadCash();
      }, 'Saving...');

      // withBusy always re-enables the button and restores the label it captured
      // before the save. updateSubmitState() owns both: after a success the mode
      // and label have changed, and after a failure a close may still be blocked
      // by pending expenses — so re-assert it here, last.
      updateSubmitState();
    }
  </script>
</body>
</html>

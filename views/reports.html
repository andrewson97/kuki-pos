<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar"><h5 class="mb-0">Reports</h5><div id="top-bar-user"></div></div>
    <div class="content-area">
      <!-- Report type selector -->
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><a class="nav-link active" href="#" onclick="switchTab('monthly', this)">Monthly P&L</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('daily', this)">Daily Report</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('products', this)">Top Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#" onclick="switchTab('stock', this)">Stock Summary</a></li>
      </ul>

      <!-- Monthly -->
      <div id="tab-monthly">
        <div class="d-flex gap-2 mb-3">
          <select class="form-select" id="report-month" style="width:150px;"></select>
          <select class="form-select" id="report-year" style="width:120px;"></select>
          <button class="btn btn-primary" onclick="loadMonthly()">Generate</button>
        </div>
        <div class="row g-4 mb-4">
          <div class="col-md-2"><div class="stat-card"><div class="stat-label">Total Sales</div><div class="stat-value" id="m-sales">-</div></div></div>
          <div class="col-md-2"><div class="stat-card"><div class="stat-label">Cost of Goods</div><div class="stat-value" id="m-cost">-</div></div></div>
          <div class="col-md-2"><div class="stat-card"><div class="stat-label">Gross Profit</div><div class="stat-value" id="m-gross">-</div></div></div>
          <div class="col-md-2"><div class="stat-card"><div class="stat-label">Expenses</div><div class="stat-value" id="m-expenses">-</div></div></div>
          <div class="col-md-2"><div class="stat-card"><div class="stat-label">Other Income</div><div class="stat-value" id="m-income">-</div></div></div>
          <div class="col-md-2"><div class="stat-card"><div class="stat-label">Net Profit</div><div class="stat-value" id="m-profit">-</div></div></div>
        </div>
        <div class="row g-4">
          <div class="col-md-8"><div class="table-container p-3"><canvas id="chart-daily-sales" height="200"></canvas></div></div>
          <div class="col-md-4"><div class="table-container p-3"><h6 class="fw-bold mb-3">Expenses by Category</h6><div id="m-exp-cats"></div></div></div>
        </div>
      </div>

      <!-- Daily -->
      <div id="tab-daily" style="display:none;">
        <div class="d-flex gap-2 mb-3">
          <input type="date" class="form-control" id="daily-date" style="width:180px;">
          <button class="btn btn-primary" onclick="loadDaily()">Generate</button>
        </div>
        <div class="row g-4 mb-4">
          <div class="col-md-3"><div class="stat-card"><div class="stat-label">Sales</div><div class="stat-value" id="d-sales">-</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="stat-label">Bills</div><div class="stat-value" id="d-bills">-</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="stat-label">Expenses</div><div class="stat-value" id="d-expenses">-</div></div></div>
          <div class="col-md-3"><div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value" id="d-profit">-</div></div></div>
        </div>
        <div class="row g-4">
          <div class="col-md-6"><div class="table-container p-3"><h6 class="fw-bold mb-3">Payment Methods</h6><div id="d-payments"></div></div></div>
          <div class="col-md-6"><div class="table-container p-3"><h6 class="fw-bold mb-3">Top Products</h6><div id="d-products"></div></div></div>
        </div>
      </div>

      <!-- Top Products -->
      <div id="tab-products" style="display:none;">
        <div class="d-flex gap-2 mb-3">
          <select class="form-select" id="top-period" style="width:150px;">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <button class="btn btn-primary" onclick="loadTopProducts()">Generate</button>
        </div>
        <div class="row g-4">
          <div class="col-md-8"><div class="table-container p-3"><canvas id="chart-top-products" height="300"></canvas></div></div>
          <div class="col-md-4"><div class="table-container p-3"><table class="table table-sm"><thead><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr></thead><tbody id="tp-table"></tbody></table></div></div>
        </div>
      </div>

      <!-- Stock -->
      <div id="tab-stock" style="display:none;">
        <div class="table-container">
          <table class="table table-hover mb-0">
            <thead><tr><th>Item</th><th>Category</th><th>Quantity</th><th>Unit</th><th>Status</th></tr></thead>
            <tbody id="stock-report-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let dailyChart = null, productChart = null;

    initApp('/reports', () => {
      // Populate month/year selectors
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const monthSel = document.getElementById('report-month');
      months.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = String(i + 1).padStart(2, '0');
        opt.textContent = m;
        if (i === new Date().getMonth()) opt.selected = true;
        monthSel.appendChild(opt);
      });
      const yearSel = document.getElementById('report-year');
      const currentYear = new Date().getFullYear();
      for (let y = currentYear - 2; y <= currentYear + 1; y++) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        if (y === currentYear) opt.selected = true;
        yearSel.appendChild(opt);
      }
      document.getElementById('daily-date').value = todayISO();
      loadMonthly();
    });

    function switchTab(tab, el) {
      document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
      ['monthly','daily','products','stock'].forEach(t => {
        document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
      });
      if (tab === 'stock') loadStockReport();
    }

    async function loadMonthly() {
      const month = document.getElementById('report-month').value;
      const year = document.getElementById('report-year').value;
      const data = await api(`/api/reports/monthly?month=${month}&year=${year}`);
      document.getElementById('m-sales').textContent = formatCurrency(data.sales.total_sales);
      document.getElementById('m-cost').textContent = formatCurrency(data.cost_of_goods);
      document.getElementById('m-gross').textContent = formatCurrency(data.gross_profit);
      document.getElementById('m-gross').style.color = data.gross_profit >= 0 ? '#28a745' : '#dc3545';
      document.getElementById('m-expenses').textContent = formatCurrency(data.expenses.total);
      document.getElementById('m-income').textContent = formatCurrency(data.other_income);
      const profitEl = document.getElementById('m-profit');
      profitEl.textContent = formatCurrency(data.net_profit);
      profitEl.style.color = data.net_profit >= 0 ? '#28a745' : '#dc3545';

      // Expense categories
      document.getElementById('m-exp-cats').innerHTML = data.expenses.by_category.map(c =>
        `<div class="d-flex justify-content-between py-1 border-bottom"><span>${c.category}</span><strong>${formatCurrency(c.total)}</strong></div>`
      ).join('') || '<p class="text-muted">No expenses</p>';

      // Daily sales chart
      if (dailyChart) dailyChart.destroy();
      const ctx = document.getElementById('chart-daily-sales').getContext('2d');
      dailyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.daily_sales.map(d => d.bill_date.substring(5)),
          datasets: [{ label: 'Daily Sales', data: data.daily_sales.map(d => d.total_sales), backgroundColor: '#e83e8c' }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } },
      });
    }

    async function loadDaily() {
      const date = document.getElementById('daily-date').value;
      const data = await api(`/api/reports/daily?date=${date}`);
      document.getElementById('d-sales').textContent = formatCurrency(data.sales.total_sales);
      document.getElementById('d-bills').textContent = data.sales.bill_count;
      document.getElementById('d-expenses').textContent = formatCurrency(data.expenses);
      document.getElementById('d-profit').textContent = formatCurrency(data.sales.total_sales - data.expenses);

      document.getElementById('d-payments').innerHTML = data.by_payment.map(p =>
        `<div class="d-flex justify-content-between py-1 border-bottom"><span>${p.payment_method.toUpperCase()} (${p.count} bills)</span><strong>${formatCurrency(p.total)}</strong></div>`
      ).join('') || '<p class="text-muted">No sales</p>';

      document.getElementById('d-products').innerHTML = data.top_products.map(p =>
        `<div class="d-flex justify-content-between py-1 border-bottom"><span>${p.product_name} (x${p.total_qty})</span><strong>${formatCurrency(p.total_revenue)}</strong></div>`
      ).join('') || '<p class="text-muted">No products sold</p>';
    }

    async function loadTopProducts() {
      const days = document.getElementById('top-period').value;
      const data = await api(`/api/reports/top-products?days=${days}`);
      document.getElementById('tp-table').innerHTML = data.map(p =>
        `<tr><td>${p.product_name}</td><td>${p.total_qty}</td><td class="fw-bold">${formatCurrency(p.total_revenue)}</td></tr>`
      ).join('') || '<tr><td colspan="3" class="text-muted text-center">No data</td></tr>';

      if (productChart) productChart.destroy();
      const ctx = document.getElementById('chart-top-products').getContext('2d');
      productChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.slice(0, 8).map(p => p.product_name),
          datasets: [{ data: data.slice(0, 8).map(p => p.total_revenue), backgroundColor: ['#e83e8c','#007bff','#28a745','#ffc107','#dc3545','#6f42c1','#17a2b8','#fd7e14'] }],
        },
        options: { responsive: true },
      });
    }

    async function loadStockReport() {
      const data = await api('/api/reports/stock-summary');
      document.getElementById('stock-report-table').innerHTML = data.map(s => `
        <tr class="${s.is_low ? 'table-danger' : ''}">
          <td class="fw-bold">${s.name}</td>
          <td>${s.category_name || '-'}</td>
          <td>${s.quantity}</td>
          <td>${s.unit}</td>
          <td>${s.is_low ? '<span class="badge bg-danger">LOW STOCK</span>' : '<span class="badge bg-success">OK</span>'}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="text-muted text-center">No stock items</td></tr>';
    }
  </script>
</body>
</html>

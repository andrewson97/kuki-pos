<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <h5 class="mb-0">Recipes / Bill of Materials</h5>
      <div id="top-bar-user"></div>
    </div>
    <div class="content-area">
      <div class="row">
        <div class="col-md-4">
          <div class="table-container p-3">
            <h6 class="fw-bold mb-3">Select a Product</h6>
            <input type="text" class="form-control mb-2" id="recipe-product-search" placeholder="Search products...">
            <div id="product-list" style="max-height:500px;overflow-y:auto;"></div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="table-container p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold mb-0" id="recipe-title">Select a product to view/edit recipe</h6>
              <div>
                <span class="badge bg-info fs-6" id="recipe-cost" style="display:none;">Cost: -</span>
              </div>
            </div>
            <div id="recipe-editor" style="display:none;">
              <table class="table table-sm">
                <thead><tr><th>Ingredient</th><th>Quantity</th><th>Unit</th><th>Cost</th><th></th></tr></thead>
                <tbody id="recipe-items"></tbody>
              </table>
              <div class="d-flex gap-2 mb-3">
                <select class="form-select" id="add-ingredient" style="width:200px;"></select>
                <input type="number" class="form-control" id="add-qty" placeholder="Qty" step="0.01" style="width:100px;">
                <button class="btn btn-outline-primary" onclick="addIngredient()">Add</button>
              </div>
              <button class="btn btn-primary" onclick="saveRecipe()">Save Recipe</button>
            </div>
            <div id="recipe-placeholder" class="text-center text-muted py-5">
              Click a product on the left to manage its recipe
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let products = [], stockItems = [], selectedProduct = null, recipeIngredients = [];
    initApp('/recipes', loadRecipePage);

    async function loadRecipePage() {
      [products, stockItems] = await Promise.all([api('/api/products'), api('/api/stock/items')]);
      renderProductList();
      const sel = document.getElementById('add-ingredient');
      sel.innerHTML = '<option value="">Select ingredient...</option>' +
        stockItems.map(s => `<option value="${s.id}">${s.name} (${s.unit})</option>`).join('');
      document.getElementById('recipe-product-search').addEventListener('input', renderProductList);
    }

    function renderProductList() {
      const search = document.getElementById('recipe-product-search').value.toLowerCase();
      const filtered = products.filter(p => !search || p.name.toLowerCase().includes(search));
      document.getElementById('product-list').innerHTML = filtered.map(p => `
        <div class="p-2 border-bottom" style="cursor:pointer;" onclick="selectProduct(${p.id})"
             ${selectedProduct?.id === p.id ? 'class="p-2 border-bottom bg-light fw-bold"' : ''}>
          ${p.name} <small class="text-muted">(${formatCurrency(p.selling_price)})</small>
        </div>
      `).join('');
    }

    async function selectProduct(id) {
      selectedProduct = products.find(p => p.id === id);
      document.getElementById('recipe-title').textContent = `Recipe: ${selectedProduct.name}`;
      document.getElementById('recipe-editor').style.display = 'block';
      document.getElementById('recipe-placeholder').style.display = 'none';

      const data = await api(`/api/recipes/${id}`);
      recipeIngredients = data.items.map(i => ({
        stock_item_id: i.stock_item_id,
        name: i.stock_item_name,
        unit: i.unit,
        quantity_needed: i.quantity_needed,
        cost_per_unit: i.cost_per_unit,
      }));
      renderRecipeItems(data.total_cost);
      renderProductList();
    }

    function renderRecipeItems(totalCost) {
      const costEl = document.getElementById('recipe-cost');
      costEl.style.display = 'inline';
      costEl.textContent = `Cost: ${formatCurrency(totalCost || 0)}`;
      if (selectedProduct) {
        const margin = selectedProduct.selling_price - (totalCost || 0);
        costEl.textContent += ` | Margin: ${formatCurrency(margin)}`;
      }

      document.getElementById('recipe-items').innerHTML = recipeIngredients.map((i, idx) => `
        <tr>
          <td>${i.name}</td>
          <td><input type="number" class="form-control form-control-sm" value="${i.quantity_needed}" step="0.01"
            onchange="recipeIngredients[${idx}].quantity_needed = parseFloat(this.value)" style="width:100px;"></td>
          <td>${i.unit}</td>
          <td>${formatCurrency(i.quantity_needed * i.cost_per_unit)}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="removeIngredient(${idx})">x</button></td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="text-center text-muted">No ingredients added yet</td></tr>';
    }

    function addIngredient() {
      const itemId = parseInt(document.getElementById('add-ingredient').value);
      const qty = parseFloat(document.getElementById('add-qty').value);
      if (!itemId || !qty) return showToast('Select ingredient and enter quantity', 'warning');

      const item = stockItems.find(s => s.id === itemId);
      if (recipeIngredients.find(r => r.stock_item_id === itemId)) {
        return showToast('Ingredient already in recipe', 'warning');
      }

      recipeIngredients.push({
        stock_item_id: item.id, name: item.name, unit: item.unit,
        quantity_needed: qty, cost_per_unit: item.cost_per_unit,
      });
      const cost = recipeIngredients.reduce((s, i) => s + i.quantity_needed * i.cost_per_unit, 0);
      renderRecipeItems(cost);
      document.getElementById('add-ingredient').value = '';
      document.getElementById('add-qty').value = '';
    }

    function removeIngredient(idx) {
      recipeIngredients.splice(idx, 1);
      const cost = recipeIngredients.reduce((s, i) => s + i.quantity_needed * i.cost_per_unit, 0);
      renderRecipeItems(cost);
    }

    async function saveRecipe() {
      if (!selectedProduct) return;
      const result = await api(`/api/recipes/${selectedProduct.id}`, {
        method: 'POST',
        body: { ingredients: recipeIngredients.map(i => ({ stock_item_id: i.stock_item_id, quantity_needed: i.quantity_needed })) },
      });
      showToast('Recipe saved!');
      renderRecipeItems(result.total_cost);
    }
  </script>
</body>
</html>

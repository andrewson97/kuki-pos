<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <h5 class="mb-0">Products</h5>
      <div id="top-bar-user"></div>
    </div>
    <div class="content-area">
      <div class="d-flex justify-content-between mb-3">
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="product-search" placeholder="Search products..." style="width:300px;">
          <button class="btn btn-outline-secondary" onclick="toggleArrangePanel()">⇅ Arrange Categories</button>
        </div>
        <button class="btn btn-primary" onclick="showAddProduct()">+ Add Product</button>
      </div>

      <div class="table-container p-3 mb-3" id="arrange-panel" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0">Category order on POS</h6>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="resetArrangeAlpha()">Reset (A–Z)</button>
            <button class="btn btn-sm btn-primary" onclick="saveArrange()">Save order</button>
          </div>
        </div>
        <small class="text-muted">Click the ↑ / ↓ to move a category. The order here is exactly what cashiers see on the POS.</small>
        <ul id="arrange-list" class="list-group mt-2"></ul>
      </div>
      <div class="table-container">
        <table class="table table-hover mb-0">
          <thead><tr><th></th><th>Name</th><th>Category</th><th>Cost</th><th>Selling</th><th>Margin</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="products-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="product-modal-title">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="product-id">
          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control" id="product-name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="product-category-select" onchange="onCategoryChange()"></select>
            <input type="text" class="form-control mt-2" id="product-category-new" placeholder="Type a new category name" style="display:none;">
          </div>
          <div class="row mb-3">
            <div class="col">
              <label class="form-label">Cost Price</label>
              <input type="number" class="form-control" id="product-cost" step="0.01" min="0" required>
            </div>
            <div class="col">
              <label class="form-label">Selling Price</label>
              <input type="number" class="form-control" id="product-price" step="0.01" min="0" required>
            </div>
            <div class="col">
              <label class="form-label">Discount Price <small class="text-muted">(optional)</small></label>
              <input type="number" class="form-control" id="product-discount" step="0.01" min="0" placeholder="leave blank for none">
            </div>
          </div>
          <div class="mb-3">
            <div id="product-margin" class="text-muted" style="font-size:0.85rem;"></div>
          </div>
          <hr>
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="product-track-stock" onchange="onTrackStockToggle()">
            <label class="form-check-label" for="product-track-stock">Track finished-product inventory</label>
            <div class="text-muted" style="font-size:0.8rem;">When on, every sale deducts 1 from the count; recipes are NOT used.</div>
          </div>
          <div class="row mb-3" id="stock-fields" style="display:none;">
            <div class="col">
              <label class="form-label">Quantity on hand</label>
              <input type="number" class="form-control" id="product-qty" step="1" min="0" value="0">
            </div>
            <div class="col">
              <label class="form-label">Reorder level (alert below)</label>
              <input type="number" class="form-control" id="product-reorder" step="1" min="0" value="0">
            </div>
            <div class="col d-flex align-items-end">
              <button type="button" class="btn btn-outline-danger w-100" id="btn-dispose" onclick="disposeProduct()" style="display:none;">Dispose (expired)…</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Also deducts stock from <small class="text-muted">(components — e.g. "Brownie w/ Ice Cream" deducts 1 Brownie)</small></label>
            <div id="components-list"></div>
            <div class="d-flex gap-2 mt-2">
              <select class="form-select" id="component-picker" style="flex:1;"></select>
              <input type="number" class="form-control" id="component-qty" style="width:80px;" step="0.01" min="0.01" value="1" placeholder="Qty">
              <button type="button" class="btn btn-outline-primary" onclick="addComponent()">Add</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Image <small class="text-muted">(optional, max 3MB)</small></label>
            <div class="d-flex align-items-center gap-3">
              <img id="product-image-preview" src="" alt="" style="display:none;width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #dee2e6;">
              <div class="flex-fill">
                <input type="file" class="form-control" id="product-image" accept="image/*">
                <button type="button" class="btn btn-sm btn-outline-danger mt-1" id="btn-remove-image" style="display:none;" onclick="removeProductImage()">Remove current image</button>
              </div>
            </div>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="product-active" checked>
            <label class="form-check-label">Active (visible in POS)</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveProduct()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let allProducts = [];
    initApp('/products', loadProducts);

    async function loadProducts() {
      allProducts = await api('/api/products');
      renderProducts();
      renderCategoryOptions();
      document.getElementById('product-search').addEventListener('input', renderProducts);
    }

    // ===== Components (composite products) =====
    let currentComponents = []; // in-memory buffer for the open modal

    function refreshComponentPicker() {
      const currentId = parseInt(document.getElementById('product-id').value) || 0;
      const used = new Set(currentComponents.map(c => c.component_product_id));
      const options = allProducts
        .filter(p => p.id !== currentId && !used.has(p.id))
        .sort((a, b) => a.name.localeCompare(b.name));
      document.getElementById('component-picker').innerHTML =
        '<option value="">-- Pick a product to link --</option>' +
        options.map(p => `<option value="${p.id}">${p.name}${p.track_stock ? ' · tracked' : ''}</option>`).join('');
    }

    function renderComponents() {
      const box = document.getElementById('components-list');
      if (!currentComponents.length) {
        box.innerHTML = '<div class="text-muted small">No linked products yet.</div>';
      } else {
        box.innerHTML = currentComponents.map((c, i) => {
          const p = allProducts.find(x => x.id === c.component_product_id);
          const name = p ? p.name : `#${c.component_product_id}`;
          return `<div class="d-flex align-items-center gap-2 py-1 border-bottom">
            <span class="flex-fill"><strong>${name}</strong> ${p?.track_stock ? '<span class="badge bg-success">tracked</span>' : '<span class="badge bg-light text-dark">not tracked</span>'}</span>
            <input type="number" class="form-control form-control-sm" style="width:80px;" value="${c.quantity}" step="0.01" min="0.01" onchange="currentComponents[${i}].quantity = parseFloat(this.value) || 0">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="currentComponents.splice(${i},1); renderComponents(); refreshComponentPicker();">×</button>
          </div>`;
        }).join('');
      }
      refreshComponentPicker();
    }

    function addComponent() {
      const cid = parseInt(document.getElementById('component-picker').value);
      const qty = parseFloat(document.getElementById('component-qty').value);
      if (!cid) { showToast('Pick a product first', 'warning'); return; }
      if (!qty || qty <= 0) { showToast('Enter a valid quantity', 'warning'); return; }
      currentComponents.push({ component_product_id: cid, quantity: qty });
      document.getElementById('component-picker').value = '';
      document.getElementById('component-qty').value = '1';
      renderComponents();
    }

    function onTrackStockToggle() {
      const on = document.getElementById('product-track-stock').checked;
      document.getElementById('stock-fields').style.display = on ? 'flex' : 'none';
      const id = document.getElementById('product-id').value;
      document.getElementById('btn-dispose').style.display = (on && id) ? 'block' : 'none';
    }

    async function disposeProduct() {
      const id = document.getElementById('product-id').value;
      if (!id) { showToast('Save the product first', 'warning'); return; }
      const qtyStr = prompt('How many units to dispose?', '1');
      if (qtyStr === null) return;
      const qty = parseFloat(qtyStr);
      if (!qty || qty <= 0) { showToast('Invalid quantity', 'error'); return; }
      const reason = prompt('Reason (e.g., expired, damaged)?', 'expired');
      if (reason === null) return;
      try {
        const r = await api(`/api/products/${id}/dispose`, { method: 'POST', body: { quantity: qty, reason } });
        showToast(`Disposed ${qty} unit(s) — loss ${formatCurrency(r.cost_loss)}`);
        await loadProducts();
        // refresh form fields from cache
        const updated = allProducts.find(x => x.id === parseInt(id));
        if (updated) document.getElementById('product-qty').value = updated.stock_quantity || 0;
      } catch (err) {
        showToast('Dispose failed: ' + err.message, 'error');
      }
    }

    // ===== Arrange categories =====
    let arrangeList = [];
    function toggleArrangePanel() {
      const p = document.getElementById('arrange-panel');
      if (p.style.display === 'none') {
        arrangeList = sortCategories([...new Set(allProducts.map(p => p.category).filter(Boolean))]);
        renderArrange();
        p.style.display = 'block';
      } else {
        p.style.display = 'none';
      }
    }
    function renderArrange() {
      document.getElementById('arrange-list').innerHTML = arrangeList.map((c, i) => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span><span class="text-muted me-2">${i + 1}.</span> ${c}</span>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-secondary" onclick="moveArrange(${i}, -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="moveArrange(${i}, 1)" ${i === arrangeList.length - 1 ? 'disabled' : ''}>↓</button>
          </div>
        </li>`).join('');
    }
    function moveArrange(i, d) {
      const j = i + d;
      if (j < 0 || j >= arrangeList.length) return;
      [arrangeList[i], arrangeList[j]] = [arrangeList[j], arrangeList[i]];
      renderArrange();
    }
    function resetArrangeAlpha() {
      arrangeList = [...arrangeList].sort((a, b) => a.localeCompare(b));
      renderArrange();
    }
    async function saveArrange() {
      try {
        await api('/api/products/category-order', { method: 'PUT', body: { order: arrangeList } });
        appSettings.category_order = JSON.stringify(arrangeList);
        showToast('Category order saved');
        document.getElementById('arrange-panel').style.display = 'none';
      } catch (err) {
        showToast('Save failed: ' + err.message, 'error');
      }
    }

    function buildCategorySelect(currentValue) {
      const sel = document.getElementById('product-category-select');
      const newInput = document.getElementById('product-category-new');
      const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      // Make sure the product's own (possibly orphan) value shows up too.
      if (currentValue && !cats.some(c => c.toLowerCase() === currentValue.toLowerCase())) {
        cats.push(currentValue);
      }
      sel.innerHTML =
        '<option value="">-- Pick a category --</option>' +
        cats.map(c => `<option value="${c.replace(/"/g, '&quot;')}" ${currentValue && c.toLowerCase() === currentValue.toLowerCase() ? 'selected' : ''}>${c}</option>`).join('') +
        '<option value="__new__">+ Add new category…</option>';
      newInput.value = '';
      newInput.style.display = 'none';
    }

    function onCategoryChange() {
      const sel = document.getElementById('product-category-select');
      const newInput = document.getElementById('product-category-new');
      if (sel.value === '__new__') {
        newInput.style.display = 'block';
        newInput.focus();
      } else {
        newInput.style.display = 'none';
        newInput.value = '';
      }
    }

    function getCategoryValue() {
      const sel = document.getElementById('product-category-select');
      if (sel.value === '__new__') return document.getElementById('product-category-new').value.trim();
      return sel.value.trim();
    }

    function renderProducts() {
      const search = document.getElementById('product-search').value.toLowerCase();
      const filtered = allProducts.filter(p => !search || p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));
      document.getElementById('products-table').innerHTML = filtered.map(p => {
        const effective = p.discount_price || p.selling_price;
        const margin = effective - (p.cost_price || 0);
        const marginPct = effective > 0 ? ((margin / effective) * 100).toFixed(0) : 0;
        const thumb = p.image_path
          ? `<img src="/uploads/${p.image_path}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:6px;">`
          : `<div style="width:42px;height:42px;background:#e9ecef;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#adb5bd;font-size:1.2rem;">&#127874;</div>`;
        let stockLabel = '';
        if (p.track_stock) {
          const out = p.stock_quantity <= 0;
          const low = p.stock_reorder_level > 0 && p.stock_quantity <= p.stock_reorder_level;
          stockLabel = out ? '<span class="badge bg-danger ms-1">Out</span>' : (low ? '<span class="badge bg-warning text-dark ms-1">Low</span>' : `<span class="badge bg-light text-dark ms-1">${p.stock_quantity}</span>`);
        }
        return `<tr>
          <td>${thumb}</td>
          <td class="fw-bold">${p.name} ${stockLabel}</td>
          <td>${p.category}</td>
          <td>${formatCurrency(p.cost_price || 0)}</td>
          <td>${p.discount_price ? `<s class="text-muted">${formatCurrency(p.selling_price)}</s> <span class="text-danger fw-bold">${formatCurrency(p.discount_price)}</span>` : formatCurrency(p.selling_price)}</td>
          <td><span class="text-${margin > 0 ? 'success' : 'danger'}">${formatCurrency(margin)} (${marginPct}%)</span></td>
          <td><span class="badge bg-${p.is_active ? 'success' : 'secondary'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="editProduct(${p.id})">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">Delete</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">No products found</td></tr>';
    }

    function updateMarginPreview() {
      const cost = parseFloat(document.getElementById('product-cost').value) || 0;
      const sell = parseFloat(document.getElementById('product-price').value) || 0;
      const margin = sell - cost;
      const pct = sell > 0 ? ((margin / sell) * 100).toFixed(0) : 0;
      const el = document.getElementById('product-margin');
      if (cost > 0 || sell > 0) {
        el.innerHTML = `Margin: <strong class="text-${margin >= 0 ? 'success' : 'danger'}">${formatCurrency(margin)} (${pct}%)</strong>`;
      } else {
        el.innerHTML = '';
      }
    }

    function showAddProduct() {
      document.getElementById('product-modal-title').textContent = 'Add Product';
      document.getElementById('product-id').value = '';
      document.getElementById('product-name').value = '';
      buildCategorySelect('');
      document.getElementById('product-cost').value = '';
      document.getElementById('product-price').value = '';
      document.getElementById('product-discount').value = '';
      document.getElementById('product-active').checked = true;
      document.getElementById('product-margin').innerHTML = '';
      document.getElementById('product-image').value = '';
      document.getElementById('product-image-preview').style.display = 'none';
      document.getElementById('btn-remove-image').style.display = 'none';
      document.getElementById('product-track-stock').checked = false;
      document.getElementById('product-qty').value = 0;
      document.getElementById('product-reorder').value = 0;
      document.getElementById('stock-fields').style.display = 'none';
      document.getElementById('btn-dispose').style.display = 'none';
      currentComponents = [];
      renderComponents();
      document.getElementById('product-cost').oninput = updateMarginPreview;
      document.getElementById('product-price').oninput = updateMarginPreview;
      new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    function editProduct(id) {
      const p = allProducts.find(x => x.id === id);
      document.getElementById('product-modal-title').textContent = 'Edit Product';
      document.getElementById('product-id').value = p.id;
      document.getElementById('product-name').value = p.name;
      buildCategorySelect(p.category);
      document.getElementById('product-cost').value = p.cost_price || 0;
      document.getElementById('product-price').value = p.selling_price;
      document.getElementById('product-discount').value = p.discount_price || '';
      document.getElementById('product-active').checked = !!p.is_active;
      document.getElementById('product-track-stock').checked = !!p.track_stock;
      document.getElementById('product-qty').value = p.stock_quantity || 0;
      document.getElementById('product-reorder').value = p.stock_reorder_level || 0;
      document.getElementById('stock-fields').style.display = p.track_stock ? 'flex' : 'none';
      document.getElementById('btn-dispose').style.display = p.track_stock ? 'block' : 'none';
      currentComponents = (p.components || []).map(c => ({ component_product_id: c.component_product_id, quantity: c.quantity }));
      renderComponents();
      document.getElementById('product-image').value = '';
      const preview = document.getElementById('product-image-preview');
      const removeBtn = document.getElementById('btn-remove-image');
      if (p.image_path) {
        preview.src = '/uploads/' + p.image_path;
        preview.style.display = 'block';
        removeBtn.style.display = 'inline-block';
      } else {
        preview.style.display = 'none';
        removeBtn.style.display = 'none';
      }
      document.getElementById('product-cost').oninput = updateMarginPreview;
      document.getElementById('product-price').oninput = updateMarginPreview;
      updateMarginPreview();
      new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    async function saveProduct() {
      const id = document.getElementById('product-id').value;
      const discountInput = document.getElementById('product-discount').value;
      const data = {
        name: document.getElementById('product-name').value,
        category: getCategoryValue() || 'General',
        cost_price: parseFloat(document.getElementById('product-cost').value) || 0,
        selling_price: parseFloat(document.getElementById('product-price').value),
        discount_price: discountInput ? parseFloat(discountInput) : null,
        is_active: document.getElementById('product-active').checked ? 1 : 0,
        track_stock: document.getElementById('product-track-stock').checked ? 1 : 0,
        stock_quantity: parseFloat(document.getElementById('product-qty').value) || 0,
        stock_reorder_level: parseFloat(document.getElementById('product-reorder').value) || 0,
        components: currentComponents.filter(c => c.component_product_id && c.quantity > 0),
      };
      let productId;
      if (id) {
        await api(`/api/products/${id}`, { method: 'PUT', body: data });
        productId = id;
      } else {
        const created = await api('/api/products', { method: 'POST', body: data });
        productId = created.id;
      }

      // Upload image if selected
      const fileInput = document.getElementById('product-image');
      if (fileInput.files && fileInput.files[0]) {
        const fd = new FormData();
        fd.append('image', fileInput.files[0]);
        try {
          const res = await fetch(`/api/products/${productId}/image`, { method: 'POST', body: fd });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showToast('Image upload failed: ' + (err.error || res.statusText), 'error');
          }
        } catch (err) {
          showToast('Image upload failed: ' + err.message, 'error');
        }
      }

      bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
      showToast('Product saved!');
      await loadProducts();
    }

    async function removeProductImage() {
      const id = document.getElementById('product-id').value;
      if (!id) return;
      if (!confirm('Remove this product image?')) return;
      await api(`/api/products/${id}/image`, { method: 'DELETE' });
      document.getElementById('product-image-preview').style.display = 'none';
      document.getElementById('btn-remove-image').style.display = 'none';
      showToast('Image removed');
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      try {
        const res = await api(`/api/products/${id}`, { method: 'DELETE' });
        showToast(res.soft_deleted ? 'Product has sales history — marked inactive' : 'Product deleted');
        loadProducts();
      } catch (err) {
        showToast('Delete failed: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>

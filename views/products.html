<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <h5 class="mb-0">Products</h5>
      <div id="top-bar-user"></div>
    </div>
    <div class="content-area">
      <div class="d-flex justify-content-between mb-3">
        <input type="text" class="form-control" id="product-search" placeholder="Search products..." style="width:300px;">
        <button class="btn btn-primary" onclick="showAddProduct()">+ Add Product</button>
      </div>
      <div class="table-container">
        <table class="table table-hover mb-0">
          <thead><tr><th></th><th>Name</th><th>Category</th><th>Cost</th><th>Selling</th><th>Margin</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="products-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="product-modal-title">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="product-id">
          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control" id="product-name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" id="product-category" list="category-options" placeholder="e.g., Cakes, Pastries, Beverages">
            <datalist id="category-options"></datalist>
            <small class="text-muted">Pick from the list to keep names consistent — "cakes" and "Cakes" are treated as the same.</small>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label class="form-label">Cost Price</label>
              <input type="number" class="form-control" id="product-cost" step="0.01" min="0" required>
            </div>
            <div class="col">
              <label class="form-label">Selling Price</label>
              <input type="number" class="form-control" id="product-price" step="0.01" min="0" required>
            </div>
            <div class="col">
              <label class="form-label">Discount Price <small class="text-muted">(optional)</small></label>
              <input type="number" class="form-control" id="product-discount" step="0.01" min="0" placeholder="leave blank for none">
            </div>
          </div>
          <div class="mb-3">
            <div id="product-margin" class="text-muted" style="font-size:0.85rem;"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Image <small class="text-muted">(optional, max 3MB)</small></label>
            <div class="d-flex align-items-center gap-3">
              <img id="product-image-preview" src="" alt="" style="display:none;width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #dee2e6;">
              <div class="flex-fill">
                <input type="file" class="form-control" id="product-image" accept="image/*">
                <button type="button" class="btn btn-sm btn-outline-danger mt-1" id="btn-remove-image" style="display:none;" onclick="removeProductImage()">Remove current image</button>
              </div>
            </div>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="product-active" checked>
            <label class="form-check-label">Active (visible in POS)</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveProduct()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let allProducts = [];
    initApp('/products', loadProducts);

    async function loadProducts() {
      allProducts = await api('/api/products');
      renderProducts();
      renderCategoryOptions();
      document.getElementById('product-search').addEventListener('input', renderProducts);
    }

    function renderCategoryOptions() {
      const cats = [...new Set(allProducts.map(p => p.category).filter(Boolean))].sort();
      document.getElementById('category-options').innerHTML = cats.map(c => `<option value="${c.replace(/"/g, '&quot;')}">`).join('');
    }

    function renderProducts() {
      const search = document.getElementById('product-search').value.toLowerCase();
      const filtered = allProducts.filter(p => !search || p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));
      document.getElementById('products-table').innerHTML = filtered.map(p => {
        const effective = p.discount_price || p.selling_price;
        const margin = effective - (p.cost_price || 0);
        const marginPct = effective > 0 ? ((margin / effective) * 100).toFixed(0) : 0;
        const thumb = p.image_path
          ? `<img src="/uploads/${p.image_path}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:6px;">`
          : `<div style="width:42px;height:42px;background:#e9ecef;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#adb5bd;font-size:1.2rem;">&#127874;</div>`;
        return `<tr>
          <td>${thumb}</td>
          <td class="fw-bold">${p.name}</td>
          <td>${p.category}</td>
          <td>${formatCurrency(p.cost_price || 0)}</td>
          <td>${p.discount_price ? `<s class="text-muted">${formatCurrency(p.selling_price)}</s> <span class="text-danger fw-bold">${formatCurrency(p.discount_price)}</span>` : formatCurrency(p.selling_price)}</td>
          <td><span class="text-${margin > 0 ? 'success' : 'danger'}">${formatCurrency(margin)} (${marginPct}%)</span></td>
          <td><span class="badge bg-${p.is_active ? 'success' : 'secondary'}">${p.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary" onclick="editProduct(${p.id})">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">Delete</button>
          </td>
        </tr>`;
      }).join('') || '<tr><td colspan="8" class="text-center text-muted py-4">No products found</td></tr>';
    }

    function updateMarginPreview() {
      const cost = parseFloat(document.getElementById('product-cost').value) || 0;
      const sell = parseFloat(document.getElementById('product-price').value) || 0;
      const margin = sell - cost;
      const pct = sell > 0 ? ((margin / sell) * 100).toFixed(0) : 0;
      const el = document.getElementById('product-margin');
      if (cost > 0 || sell > 0) {
        el.innerHTML = `Margin: <strong class="text-${margin >= 0 ? 'success' : 'danger'}">${formatCurrency(margin)} (${pct}%)</strong>`;
      } else {
        el.innerHTML = '';
      }
    }

    function showAddProduct() {
      document.getElementById('product-modal-title').textContent = 'Add Product';
      document.getElementById('product-id').value = '';
      document.getElementById('product-name').value = '';
      document.getElementById('product-category').value = '';
      document.getElementById('product-cost').value = '';
      document.getElementById('product-price').value = '';
      document.getElementById('product-discount').value = '';
      document.getElementById('product-active').checked = true;
      document.getElementById('product-margin').innerHTML = '';
      document.getElementById('product-image').value = '';
      document.getElementById('product-image-preview').style.display = 'none';
      document.getElementById('btn-remove-image').style.display = 'none';
      document.getElementById('product-cost').oninput = updateMarginPreview;
      document.getElementById('product-price').oninput = updateMarginPreview;
      new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    function editProduct(id) {
      const p = allProducts.find(x => x.id === id);
      document.getElementById('product-modal-title').textContent = 'Edit Product';
      document.getElementById('product-id').value = p.id;
      document.getElementById('product-name').value = p.name;
      document.getElementById('product-category').value = p.category;
      document.getElementById('product-cost').value = p.cost_price || 0;
      document.getElementById('product-price').value = p.selling_price;
      document.getElementById('product-discount').value = p.discount_price || '';
      document.getElementById('product-active').checked = !!p.is_active;
      document.getElementById('product-image').value = '';
      const preview = document.getElementById('product-image-preview');
      const removeBtn = document.getElementById('btn-remove-image');
      if (p.image_path) {
        preview.src = '/uploads/' + p.image_path;
        preview.style.display = 'block';
        removeBtn.style.display = 'inline-block';
      } else {
        preview.style.display = 'none';
        removeBtn.style.display = 'none';
      }
      document.getElementById('product-cost').oninput = updateMarginPreview;
      document.getElementById('product-price').oninput = updateMarginPreview;
      updateMarginPreview();
      new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    async function saveProduct() {
      const id = document.getElementById('product-id').value;
      const discountInput = document.getElementById('product-discount').value;
      const data = {
        name: document.getElementById('product-name').value,
        category: document.getElementById('product-category').value || 'General',
        cost_price: parseFloat(document.getElementById('product-cost').value) || 0,
        selling_price: parseFloat(document.getElementById('product-price').value),
        discount_price: discountInput ? parseFloat(discountInput) : null,
        is_active: document.getElementById('product-active').checked ? 1 : 0,
      };
      let productId;
      if (id) {
        await api(`/api/products/${id}`, { method: 'PUT', body: data });
        productId = id;
      } else {
        const created = await api('/api/products', { method: 'POST', body: data });
        productId = created.id;
      }

      // Upload image if selected
      const fileInput = document.getElementById('product-image');
      if (fileInput.files && fileInput.files[0]) {
        const fd = new FormData();
        fd.append('image', fileInput.files[0]);
        try {
          const res = await fetch(`/api/products/${productId}/image`, { method: 'POST', body: fd });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            showToast('Image upload failed: ' + (err.error || res.statusText), 'error');
          }
        } catch (err) {
          showToast('Image upload failed: ' + err.message, 'error');
        }
      }

      bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
      showToast('Product saved!');
      await loadProducts();
    }

    async function removeProductImage() {
      const id = document.getElementById('product-id').value;
      if (!id) return;
      if (!confirm('Remove this product image?')) return;
      await api(`/api/products/${id}/image`, { method: 'DELETE' });
      document.getElementById('product-image-preview').style.display = 'none';
      document.getElementById('btn-remove-image').style.display = 'none';
      showToast('Image removed');
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      try {
        const res = await api(`/api/products/${id}`, { method: 'DELETE' });
        showToast(res.soft_deleted ? 'Product has sales history — marked inactive' : 'Product deleted');
        loadProducts();
      } catch (err) {
        showToast('Delete failed: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>

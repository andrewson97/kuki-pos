<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tasks - KUKI POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
  <style>
    .task-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 14px;
      transition: background 0.15s, border-color 0.15s;
    }
    .task-card.done {
      background: #f0fdf4; border-color: #bbf7d0;
    }
    .task-check {
      flex-shrink: 0;
      width: 28px; height: 28px;
      border: 2px solid #cbd5e1; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; background: white;
      transition: all 0.15s;
    }
    .task-card.done .task-check {
      background: #16a34a; border-color: #16a34a; color: white;
    }
    .task-check:hover { border-color: #16a34a; }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-weight: 600; color: #1f2937; }
    .task-card.done .task-title { text-decoration: line-through; color: #6b7280; }
    .task-desc { font-size: 0.85rem; color: #6b7280; margin-top: 2px; }
    .task-meta { font-size: 0.78rem; color: #16a34a; margin-top: 4px; font-weight: 500; }
    .task-admin { display: flex; gap: 4px; flex-shrink: 0; }
    .progress-summary {
      color: white; padding: 14px 18px; border-radius: 10px;
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .progress-summary.opening { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .progress-summary.closing { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
    .progress-summary h6 { margin: 0; font-size: 0.8rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.1em; }
    .progress-summary .big { font-size: 1.5rem; font-weight: 700; }
    .section-block { margin-bottom: 28px; }
    .cat-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 600;
    }
    .cat-tag.opening { background: #fef3c7; color: #92400e; }
    .cat-tag.closing { background: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <h5 class="mb-0">Daily Tasks</h5>
      <div id="top-bar-user"></div>
    </div>
    <div class="content-area">
      <div class="row">
        <div class="col-lg-8">
          <div id="tasks-container"></div>
        </div>
        <div class="col-lg-4">
          <div class="table-container p-3" id="admin-panel" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold mb-0">Manage Tasks</h6>
              <button class="btn btn-sm btn-primary" onclick="showAddTask()">+ Add</button>
            </div>
            <div id="all-tasks-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="task-modal-title">Add Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="task-id">
          <div class="mb-3">
            <label class="form-label">List</label>
            <select class="form-select" id="task-category">
              <option value="opening">🌅 Opening — start of shift</option>
              <option value="closing">🌙 Closing — end of shift</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="task-title" placeholder="e.g., Clean coffee machine">
          </div>
          <div class="mb-3">
            <label class="form-label">Description <small class="text-muted">(optional)</small></label>
            <textarea class="form-control" id="task-desc" rows="2" placeholder="Any extra notes for the cashier"></textarea>
          </div>
          <div class="row">
            <div class="col-6">
              <label class="form-label">Order</label>
              <input type="number" class="form-control" id="task-order" value="0" min="0">
            </div>
            <div class="col-6 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="task-active" checked>
                <label class="form-check-label" for="task-active">Active</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveTask()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let allTasksCache = [];
    initApp('/tasks', loadTasks);

    async function loadTasks() {
      const tasks = await api('/api/tasks');
      renderTasks(tasks);

      if (currentUser.role === 'admin') {
        document.getElementById('admin-panel').style.display = 'block';
        allTasksCache = await api('/api/tasks/all');
        renderAdminTasks();
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-container');
      if (tasks.length === 0) {
        container.innerHTML = `<div class="alert alert-info">No daily tasks set up yet${currentUser.role === 'admin' ? '. Add some using the panel on the right.' : '. Ask the admin to add tasks.'}</div>`;
        return;
      }
      const opening = tasks.filter(t => (t.category || 'opening') === 'opening');
      const closing = tasks.filter(t => t.category === 'closing');
      container.innerHTML =
        renderSection('🌅 Opening Tasks', 'opening', opening) +
        renderSection('🌙 Closing Tasks', 'closing', closing);
    }

    function renderSection(title, cls, tasks) {
      if (tasks.length === 0) return '';
      const done = tasks.filter(t => t.completion_id != null).length;
      const total = tasks.length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      const items = tasks.map(t => {
        const isDone = t.completion_id != null;
        return `
          <div class="task-card ${isDone ? 'done' : ''}" data-id="${t.id}">
            <span class="task-check" onclick="toggleTask(${t.id}, ${isDone})">
              ${isDone ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
            </span>
            <div class="task-body">
              <div class="task-title">${escapeHtml(t.title)}</div>
              ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ''}
              ${isDone ? `<div class="task-meta">Done by ${t.completed_by_name || '-'} at ${formatTime(t.completed_at)}</div>` : ''}
            </div>
          </div>`;
      }).join('');
      return `<div class="section-block">
        <div class="progress-summary ${cls}">
          <div><h6>${title}</h6><div class="big">${done} / ${total}</div></div>
          <div style="text-align:right"><h6>Complete</h6><div class="big">${pct}%</div></div>
        </div>
        ${items}
      </div>`;
    }

    function renderAdminTasks() {
      document.getElementById('all-tasks-list').innerHTML = allTasksCache.map(t => {
        const cat = t.category || 'opening';
        return `
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
          <div>
            <div class="fw-semibold ${t.is_active ? '' : 'text-muted'}" style="font-size:0.9rem;">${escapeHtml(t.title)}</div>
            <span class="cat-tag ${cat}">${cat}</span>
            <small class="text-muted ms-1">${t.is_active ? '' : '· Inactive'}</small>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-secondary" onclick="editTask(${t.id})">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${t.id})">&times;</button>
          </div>
        </div>`;
      }).join('') || '<p class="text-muted small mb-0">No tasks yet</p>';
    }

    async function toggleTask(id, isDone) {
      try {
        if (isDone) {
          if (!confirm('Un-check this task?')) return;
          await api(`/api/tasks/${id}/complete`, { method: 'DELETE' });
        } else {
          await api(`/api/tasks/${id}/complete`, { method: 'POST', body: {} });
        }
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function showAddTask() {
      document.getElementById('task-modal-title').textContent = 'Add Task';
      document.getElementById('task-id').value = '';
      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      document.getElementById('task-order').value = allTasksCache.length;
      document.getElementById('task-active').checked = true;
      document.getElementById('task-category').value = 'opening';
      new bootstrap.Modal(document.getElementById('taskModal')).show();
    }

    function editTask(id) {
      const t = allTasksCache.find(x => x.id === id);
      document.getElementById('task-modal-title').textContent = 'Edit Task';
      document.getElementById('task-id').value = t.id;
      document.getElementById('task-title').value = t.title;
      document.getElementById('task-desc').value = t.description || '';
      document.getElementById('task-order').value = t.display_order || 0;
      document.getElementById('task-active').checked = !!t.is_active;
      document.getElementById('task-category').value = t.category || 'opening';
      new bootstrap.Modal(document.getElementById('taskModal')).show();
    }

    async function saveTask() {
      const id = document.getElementById('task-id').value;
      const title = document.getElementById('task-title').value.trim();
      if (!title) { showToast('Title required', 'error'); return; }
      const body = {
        title,
        description: document.getElementById('task-desc').value.trim(),
        display_order: parseInt(document.getElementById('task-order').value) || 0,
        is_active: document.getElementById('task-active').checked,
        category: document.getElementById('task-category').value,
      };
      try {
        if (id) {
          await api(`/api/tasks/${id}`, { method: 'PUT', body });
        } else {
          await api('/api/tasks', { method: 'POST', body });
        }
        bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
        showToast('Saved');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task? Completion history will also be removed.')) return;
      try {
        await api(`/api/tasks/${id}`, { method: 'DELETE' });
        showToast('Deleted');
        loadTasks();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
  </script>
</body>
</html>

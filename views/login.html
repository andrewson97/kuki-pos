<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="text-center mb-4">
        <img src="/public/img/kuki_logo.png" alt="KUKI" style="max-width:160px;max-height:120px;margin-bottom:8px;">
        <p class="text-muted">Sign in to continue</p>
      </div>
      <div id="error-msg" class="alert alert-danger d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control form-control-lg" id="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control form-control-lg" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Sign In</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0" style="font-size:0.8rem">Default: admin / admin123</p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('d-none');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Login failed';
          errEl.classList.remove('d-none');
          return;
        }
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = 'Connection error';
        errEl.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e83e8c">
  <title>KUKI · Products</title>
  <link rel="icon" href="/public/img/kuki_logo.png">
  <link rel="stylesheet" href="/public/css/mobile.css">
</head>
<body>
  <div class="topbar">
    <a href="/m" class="back">‹</a>
    <h1>Products</h1>
    <a href="/products?desktop=1" class="right">Desktop</a>
  </div>
  <!-- Search takes its own row so the two selects sit side by side at 360px. -->
  <div class="filters">
    <input type="text" id="prod-search" placeholder="Search products…" style="flex:1 1 100%;">
    <select id="prod-cat" onchange="render()"><option value="">All categories</option></select>
    <select id="prod-status" onchange="render()">
      <option value="">Active + inactive</option>
      <option value="active">Active only</option>
      <option value="inactive">Inactive only</option>
    </select>
  </div>
  <div id="prod-count" style="background:white;padding:6px 14px 10px;font-size:0.76rem;color:var(--ink-soft);border-bottom:1px solid var(--line);"></div>
  <div id="prod-list"><div class="empty">Loading…</div></div>

  <!-- Discontinued: permanently off the menu, kept only because old bills point
       at them. Admin-only, hidden while there are none, and collapsed when there
       are — it must never push the real product list off a phone screen. -->
  <div id="disc-section" style="display:none;">
    <div onclick="toggleDisc()" style="background:white;padding:12px 14px;border-top:8px solid var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;">Discontinued <span id="disc-count" style="text-transform:none;letter-spacing:0;font-weight:400;"></span></span>
      <span id="disc-caret" style="color:var(--ink-soft);font-size:0.9rem;">▸</span>
    </div>
    <div id="disc-body" style="display:none;">
      <div style="background:white;padding:0 14px 10px;font-size:0.76rem;color:var(--ink-soft);border-bottom:1px solid var(--line);">These could not be deleted because past bills reference them. Restore brings one back as <b>inactive</b> — not straight onto the menu; switch it to Active yourself when you want to sell it again.</div>
      <div id="disc-list"></div>
    </div>
  </div>

  <button class="fab" id="fab" onclick="openAdd()" style="display:none;">+</button>

  <div class="sheet" id="prod-sheet" onclick="if(event.target===this)closeSheet('prod-sheet')">
    <div class="sheet-inner">
      <div class="sheet-handle"></div>
      <h3 id="sheet-title">Edit product</h3>
      <input type="hidden" id="p-id">
      <div class="field"><label>Name</label><input type="text" id="p-name"></div>
      <div class="field">
        <label>Category</label>
        <select id="p-cat-sel" onchange="onCatChange()"></select>
        <input type="text" id="p-cat-new" placeholder="Type a new category name" style="display:none;margin-top:6px;">
      </div>
      <div class="field"><label>Cost price (Rs.)</label><input type="number" id="p-cost" min="0" step="0.01" inputmode="decimal"></div>
      <div class="field"><label>Selling price (Rs.)</label><input type="number" id="p-price" min="0" step="0.01" inputmode="decimal"></div>
      <div class="field"><label>Discount price (optional)</label><input type="number" id="p-disc" min="0" step="0.01" inputmode="decimal" placeholder="leave blank for none"></div>
      <div class="field"><label><input type="checkbox" id="p-active" checked> Active (shown in POS)</label></div>
      <div class="field"><label><input type="checkbox" id="p-track" onchange="onTrackToggle()"> Track finished-product inventory</label></div>
      <div id="stock-fields" style="display:none;">
        <div class="field"><label>Quantity on hand</label><input type="number" id="p-qty" min="0" step="1" value="0" inputmode="numeric"></div>
        <div class="field"><label>Reorder level (alert below)</label><input type="number" id="p-reorder" min="0" step="1" value="0" inputmode="numeric"></div>
        <button class="btn btn-danger" id="p-dispose" style="display:none;" onclick="disposeProduct(this)">Dispose (expired)…</button>
      </div>
      <div class="field">
        <label>Also deducts stock from <small style="color:var(--ink-soft);">(components)</small></label>
        <div id="p-components-list"></div>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <select id="p-comp-pick" style="flex:1;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:white;"></select>
          <input type="number" id="p-comp-qty" min="0.01" step="0.01" value="1" style="width:70px;padding:8px;border:1.5px solid var(--line);border-radius:8px;">
          <button class="btn btn-outline" onclick="addComp()" style="padding:8px 14px;">Add</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet('prod-sheet')">Cancel</button>
        <button class="btn btn-primary" onclick="saveProd(this)">Save</button>
      </div>
      <button class="btn btn-danger" style="margin-top:8px;" id="p-delete" onclick="delProd(this)">Delete</button>
    </div>
  </div>

  <script src="/public/js/mobile.js"></script>
  <script>
    let allProds = [];      // active + inactive (the API leaves discontinued out)
    let discProds = [];     // discontinued only, fetched separately
    let discOpen = false;   // the discontinued section starts collapsed

    async function load() {
      await bootMobile();
      if (currentUser.role !== 'admin') { $('fab').style.display = 'none'; toast('Read-only — admin needed to edit'); }
      else { $('fab').style.display = 'block'; }
      await reloadAll();
      $('prod-search').addEventListener('input', render);
    }

    // Both lists always move together: a delete can push a product out of the
    // main list into the discontinued one, and a restore pulls it back.
    async function reloadAll() {
      const isAdmin = currentUser.role === 'admin';
      const [prods, disc] = await Promise.all([
        api('/api/products'),
        isAdmin ? api('/api/products?discontinued=1') : Promise.resolve([]),
      ]);
      allProds = prods;
      discProds = disc || [];
      renderCatOptions();
      render();
      renderDiscontinued();
    }

    function buildCatSelect(currentValue) {
      const sel = $('p-cat-sel');
      const newInput = $('p-cat-new');
      const cats = [...new Set(allProds.map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      if (currentValue && !cats.some(c => c.toLowerCase() === currentValue.toLowerCase())) cats.push(currentValue);
      sel.innerHTML =
        '<option value="">-- Pick a category --</option>' +
        cats.map(c => `<option value="${c.replace(/"/g, '&quot;')}" ${currentValue && c.toLowerCase() === currentValue.toLowerCase() ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('') +
        '<option value="__new__">+ Add new category…</option>';
      newInput.value = '';
      newInput.style.display = 'none';
    }
    function onCatChange() {
      const sel = $('p-cat-sel');
      const newInput = $('p-cat-new');
      if (sel.value === '__new__') { newInput.style.display = 'block'; newInput.focus(); }
      else { newInput.style.display = 'none'; newInput.value = ''; }
    }
    function getCatValue() {
      const sel = $('p-cat-sel');
      if (sel.value === '__new__') return $('p-cat-new').value.trim();
      return sel.value.trim();
    }

    // Fills the category filter above the list. Keeps the current choice if that
    // category still exists, so a reload after a save does not reset the filter.
    function renderCatOptions() {
      const sel = $('prod-cat');
      const prev = sel.value;
      const cats = sortCategoriesPOS([...new Set(allProds.map(p => p.category).filter(Boolean))]);
      sel.innerHTML = '<option value="">All categories</option>' +
        cats.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${escapeHtml(c)}</option>`).join('');
      sel.value = cats.indexOf(prev) !== -1 ? prev : '';
    }

    // Three states now, not two. Discontinued never reaches the main list (the
    // API excludes it and render() filters it out again), but the badge lives
    // here so the two lists agree on wording.
    function statusBadge(p) {
      if (p.is_discontinued) return '<span class="badge danger">discontinued</span>';
      return p.is_active ? '<span class="badge success">active</span>' : '<span class="badge muted">inactive</span>';
    }

    // Search + category + status all narrow the same list (AND, not OR).
    function render() {
      const q = $('prod-search').value.toLowerCase().trim();
      const cat = $('prod-cat').value.toLowerCase();
      const status = $('prod-status').value;
      const filtered = allProds.filter(p => {
        if (p.is_discontinued) return false;
        if (q && !(p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q))) return false;
        if (cat && (p.category || '').toLowerCase() !== cat) return false;
        if (status === 'active' && !p.is_active) return false;
        if (status === 'inactive' && p.is_active) return false;
        return true;
      });
      const total = allProds.filter(p => !p.is_discontinued).length;
      $('prod-count').textContent = filtered.length === total
        ? `${total} product${total === 1 ? '' : 's'}`
        : `Showing ${filtered.length} of ${total} — filters are hiding ${total - filtered.length}`;
      if (!filtered.length) { $('prod-list').innerHTML = `<div class="empty">${total ? 'No products match these filters' : 'No products'}</div>`; return; }
      const isAdmin = currentUser.role === 'admin';
      $('prod-list').innerHTML = filtered.map(p => {
        const eff = p.discount_price || p.selling_price;
        const priceHtml = p.discount_price
          ? `<s style="color:var(--ink-soft);font-size:0.78rem;">${fmt(p.selling_price)}</s> <strong style="color:var(--red);">${fmt(eff)}</strong>`
          : `<strong>${fmt(eff)}</strong>`;
        return `<div class="list-item" ${isAdmin ? `onclick="editProd(${p.id})"` : ''} style="display:flex;gap:12px;align-items:center;min-height:52px;">
          <div style="flex:1;min-width:0;">
            <div class="list-title">${escapeHtml(p.name)} ${statusBadge(p)}</div>
            <div class="list-meta">${escapeHtml(p.category || '-')} · cost ${fmt(p.cost_price)}</div>
          </div>
          <div style="text-align:right;">${priceHtml}</div>
        </div>`;
      }).join('');
    }

    // ===== Discontinued =====
    function toggleDisc() {
      discOpen = !discOpen;
      $('disc-body').style.display = discOpen ? 'block' : 'none';
      $('disc-caret').textContent = discOpen ? '▾' : '▸';
    }

    function renderDiscontinued() {
      const sec = $('disc-section');
      const isAdmin = currentUser.role === 'admin';
      // Nothing to show: hide the whole section, unless it is open — leaving it
      // up with an empty state is what confirms the last restore worked.
      if (!isAdmin || (!discProds.length && !discOpen)) { sec.style.display = 'none'; return; }
      sec.style.display = 'block';
      $('disc-count').textContent = discProds.length ? `(${discProds.length})` : '';
      $('disc-body').style.display = discOpen ? 'block' : 'none';
      $('disc-caret').textContent = discOpen ? '▾' : '▸';
      if (!discProds.length) { $('disc-list').innerHTML = '<div class="empty">Nothing is discontinued — every product is in the list above.</div>'; return; }
      $('disc-list').innerHTML = discProds.map(p => `<div class="list-item">
        <div class="list-head">
          <span class="list-title">${escapeHtml(p.name)} ${statusBadge(p)}</span>
          <span class="list-amount">${fmt(p.discount_price || p.selling_price)}</span>
        </div>
        <div class="list-meta">${escapeHtml(p.category || '-')} · cost ${fmt(p.cost_price)}</div>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;width:auto;" onclick="restoreProd(${p.id}, this)">Restore as inactive</button>
      </div>`).join('');
    }

    // confirm() sits OUTSIDE withBusy: the guard is only there to stop a second
    // tap while the POST is in flight, and a modal inside it would hold the
    // button disabled for as long as the dialog stayed open.
    async function restoreProd(id, btn) {
      const p = discProds.find(x => x.id === id);
      if (!p) return;
      if (!confirm(`Restore "${p.name}"?\n\nIt comes back as INACTIVE — still hidden from the POS. Open it and tick Active when you want to sell it again.`)) return;
      await withBusy(btn, async () => {
        await api(`/api/products/${id}/restore`, { method: 'POST' });
        toast(`Restored "${p.name}" — now inactive, not yet on the menu`);
        await reloadAll();
      }, 'Restoring…');
    }

    function openAdd() {
      $('sheet-title').textContent = 'New product';
      $('p-id').value = '';
      ['p-name', 'p-cost', 'p-price', 'p-disc'].forEach(id => $(id).value = '');
      buildCatSelect('');
      $('p-active').checked = true;
      $('p-track').checked = false;
      $('p-qty').value = 0;
      $('p-reorder').value = 0;
      $('stock-fields').style.display = 'none';
      $('p-dispose').style.display = 'none';
      $('p-delete').style.display = 'none';
      currentComponents = [];
      renderComps();
      openSheet('prod-sheet');
    }

    let currentComponents = [];
    function refreshCompPicker() {
      const currentId = parseInt($('p-id').value) || 0;
      const used = new Set(currentComponents.map(c => c.component_product_id));
      const opts = allProds
        .filter(p => p.id !== currentId && !used.has(p.id))
        .sort((a, b) => a.name.localeCompare(b.name));
      $('p-comp-pick').innerHTML = '<option value="">-- Pick a product --</option>' +
        opts.map(p => `<option value="${p.id}">${escapeHtml(p.name)}${p.track_stock ? ' · tracked' : ''}</option>`).join('');
    }
    function renderComps() {
      const box = $('p-components-list');
      if (!currentComponents.length) { box.innerHTML = '<div style="color:var(--ink-soft);font-size:0.85rem;padding:6px 0;">No linked products.</div>'; refreshCompPicker(); return; }
      box.innerHTML = currentComponents.map((c, i) => {
        const p = allProds.find(x => x.id === c.component_product_id);
        const name = p ? p.name : `#${c.component_product_id}`;
        return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);">
          <span style="flex:1;"><strong>${escapeHtml(name)}</strong></span>
          <input type="number" value="${c.quantity}" step="0.01" min="0.01" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:6px;" oninput="currentComponents[${i}].quantity = parseFloat(this.value) || 0">
          <button class="btn btn-danger" onclick="currentComponents.splice(${i},1); renderComps();" style="padding:4px 10px;">×</button>
        </div>`;
      }).join('');
      refreshCompPicker();
    }
    function addComp() {
      const cid = parseInt($('p-comp-pick').value);
      const qty = parseFloat($('p-comp-qty').value);
      if (!cid || !qty || qty <= 0) { toast('Pick a product and quantity', 'error'); return; }
      currentComponents.push({ component_product_id: cid, quantity: qty });
      $('p-comp-pick').value = ''; $('p-comp-qty').value = '1';
      renderComps();
    }

    function onTrackToggle() {
      const on = $('p-track').checked;
      $('stock-fields').style.display = on ? 'block' : 'none';
      $('p-dispose').style.display = (on && $('p-id').value) ? 'block' : 'none';
    }

    function editProd(id) {
      const p = allProds.find(x => x.id === id);
      $('sheet-title').textContent = 'Edit product';
      $('p-id').value = p.id;
      $('p-name').value = p.name;
      buildCatSelect(p.category || '');
      $('p-cost').value = p.cost_price || 0;
      $('p-price').value = p.selling_price;
      $('p-disc').value = p.discount_price || '';
      $('p-active').checked = !!p.is_active;
      $('p-track').checked = !!p.track_stock;
      $('p-qty').value = p.stock_quantity || 0;
      $('p-reorder').value = p.stock_reorder_level || 0;
      $('stock-fields').style.display = p.track_stock ? 'block' : 'none';
      $('p-dispose').style.display = p.track_stock ? 'block' : 'none';
      currentComponents = (p.components || []).map(c => ({ component_product_id: c.component_product_id, quantity: c.quantity }));
      renderComps();
      $('p-delete').style.display = 'block';
      openSheet('prod-sheet');
    }

    async function saveProd(btn) {
      const id = $('p-id').value;
      const disc = $('p-disc').value;
      const body = {
        name: $('p-name').value.trim(),
        category: getCatValue() || 'General',
        cost_price: parseFloat($('p-cost').value) || 0,
        selling_price: parseFloat($('p-price').value),
        discount_price: disc ? parseFloat(disc) : null,
        is_active: $('p-active').checked ? 1 : 0,
        track_stock: $('p-track').checked ? 1 : 0,
        stock_quantity: parseFloat($('p-qty').value) || 0,
        stock_reorder_level: parseFloat($('p-reorder').value) || 0,
        components: currentComponents.filter(c => c.component_product_id && c.quantity > 0),
      };
      if (!body.name) { toast('Name required', 'error'); return; }
      if (!body.selling_price) { toast('Selling price required', 'error'); return; }
      await withBusy(btn, async () => {
        if (id) await api(`/api/products/${id}`, { method: 'PUT', body });
        else await api('/api/products', { method: 'POST', body });
        closeSheet('prod-sheet');
        toast('Saved');
        await reloadAll();
      }, 'Saving…');
    }

    async function disposeProduct(btn) {
      const id = $('p-id').value;
      if (!id) { toast('Save the product first', 'error'); return; }
      const qtyStr = prompt('How many units to dispose?', '1');
      if (qtyStr === null) return;
      const qty = parseFloat(qtyStr);
      if (!qty || qty <= 0) { toast('Invalid quantity', 'error'); return; }
      const reason = prompt('Reason (e.g., expired, damaged)?', 'expired');
      if (reason === null) return;
      await withBusy(btn, async () => {
        const r = await api(`/api/products/${id}/dispose`, { method: 'POST', body: { quantity: qty, reason } });
        toast(`Disposed ${qty} — loss ${fmt(r.cost_loss)}`);
        await reloadAll();
        const updated = allProds.find(x => x.id === parseInt(id));
        if (updated) $('p-qty').value = updated.stock_quantity || 0;
      }, 'Disposing…');
    }

    // Three outcomes, and the user is told which one happened:
    //   { success }                       → the row is gone for good
    //   { success, discontinued, reason } → sold in the past, so it was moved to
    //                                       Discontinued instead of deleted
    //   400                               → refused (a recipe uses it, or it is
    //                                       in a live cart). withBusy already
    //                                       toasts the server's message, which
    //                                       names the blocker, so we let it throw.
    async function delProd(btn) {
      const id = $('p-id').value;
      if (!id) return;
      const name = $('p-name').value.trim() || 'this product';
      if (!confirm(`Delete "${name}"?\n\nIf it has ever been sold it cannot be deleted — it will be moved to Discontinued instead, so old bills still add up.`)) return;
      await withBusy(btn, async () => {
        const r = await api(`/api/products/${id}`, { method: 'DELETE' });
        closeSheet('prod-sheet');
        if (r.discontinued) {
          discOpen = true;   // open the section so it is obvious where it went
          toast(`"${name}" appears in past sales — not deleted, moved to Discontinued.`);
        } else {
          toast('Product deleted');
        }
        await reloadAll();
      }, 'Deleting…');
    }

    load();
  </script>
</body>
</html>

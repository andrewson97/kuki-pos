<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar"><h5 class="mb-0">Customers</h5><div id="top-bar-user"></div></div>
    <div class="content-area">
      <div class="d-flex justify-content-between mb-3">
        <input type="text" class="form-control" id="cust-search" placeholder="Search name or phone..." style="width:300px;">
        <button class="btn btn-primary" onclick="showAddCustomer()">+ Add Customer</button>
      </div>
      <div class="table-container">
        <table class="table table-hover mb-0">
          <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Notes</th><th>Since</th><th>Actions</th></tr></thead>
          <tbody id="customers-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="cust-modal-title">Add Customer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="cust-id">
          <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" id="cust-name" required></div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" id="cust-phone"></div>
          <div class="mb-3"><label class="form-label">Address</label><input type="text" class="form-control" id="cust-address"></div>
          <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="cust-notes" rows="2"></textarea></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" onclick="saveCustomer()">Save</button></div>
      </div>
    </div>
  </div>

  <!-- Order History Modal -->
  <div class="modal fade" id="ordersModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="orders-title">Order History</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <table class="table table-sm"><thead><tr><th>Token</th><th>Date</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="orders-table"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let allCustomers = [];
    initApp('/customers', loadCustomers);

    async function loadCustomers() {
      allCustomers = await api('/api/customers');
      renderCustomers();
      document.getElementById('cust-search').addEventListener('input', renderCustomers);
    }

    function renderCustomers() {
      const search = document.getElementById('cust-search').value.toLowerCase();
      const filtered = allCustomers.filter(c => !search || c.name.toLowerCase().includes(search) || (c.phone || '').includes(search));
      document.getElementById('customers-table').innerHTML = filtered.map(c => `
        <tr>
          <td class="fw-bold">${c.name}</td>
          <td>${c.phone || '-'}</td>
          <td>${c.address || '-'}</td>
          <td>${c.notes || '-'}</td>
          <td>${formatDate(c.created_at)}</td>
          <td>
            <button class="btn btn-sm btn-outline-info" onclick="viewOrders(${c.id}, '${c.name}')">Orders</button>
            <button class="btn btn-sm btn-outline-primary" onclick="editCustomer(${c.id})">Edit</button>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">No customers</td></tr>';
    }

    function showAddCustomer() {
      document.getElementById('cust-modal-title').textContent = 'Add Customer';
      document.getElementById('cust-id').value = '';
      document.getElementById('cust-name').value = '';
      document.getElementById('cust-phone').value = '';
      document.getElementById('cust-address').value = '';
      document.getElementById('cust-notes').value = '';
      new bootstrap.Modal(document.getElementById('customerModal')).show();
    }

    function editCustomer(id) {
      const c = allCustomers.find(x => x.id === id);
      document.getElementById('cust-modal-title').textContent = 'Edit Customer';
      document.getElementById('cust-id').value = c.id;
      document.getElementById('cust-name').value = c.name;
      document.getElementById('cust-phone').value = c.phone || '';
      document.getElementById('cust-address').value = c.address || '';
      document.getElementById('cust-notes').value = c.notes || '';
      new bootstrap.Modal(document.getElementById('customerModal')).show();
    }

    async function saveCustomer() {
      const id = document.getElementById('cust-id').value;
      const data = {
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        address: document.getElementById('cust-address').value,
        notes: document.getElementById('cust-notes').value,
      };
      if (id) await api(`/api/customers/${id}`, { method: 'PUT', body: data });
      else await api('/api/customers', { method: 'POST', body: data });
      bootstrap.Modal.getInstance(document.getElementById('customerModal')).hide();
      showToast('Customer saved!');
      loadCustomers();
    }

    async function viewOrders(id, name) {
      document.getElementById('orders-title').textContent = `Orders - ${name}`;
      const orders = await api(`/api/customers/${id}/orders`);
      document.getElementById('orders-table').innerHTML = orders.map(o => `
        <tr>
          <td>#${String(o.token_number).padStart(3,'0')}</td>
          <td>${formatDate(o.bill_date)}</td>
          <td class="fw-bold">${formatCurrency(o.total)}</td>
          <td><span class="badge bg-info">${o.payment_method}</span></td>
          <td><span class="badge bg-${o.status === 'completed' ? 'success' : 'danger'}">${o.status}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="text-center text-muted">No orders yet</td></tr>';
      new bootstrap.Modal(document.getElementById('ordersModal')).show();
    }
  </script>
</body>
</html>

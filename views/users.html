<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar"><h5 class="mb-0">User Management</h5><div id="top-bar-user"></div></div>
    <div class="content-area">
      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary" onclick="showAddUser()">+ Add User</button>
      </div>
      <div class="table-container">
        <table class="table table-hover mb-0">
          <thead><tr><th>Username</th><th>Full Name</th><th>Role</th><th>Status</th><th>Dashboard money</th><th class="text-end">Owes</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="users-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="user-modal-title">Add User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="user-id">
          <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" id="user-username" required></div>
          <div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" id="user-fullname" required></div>
          <div class="mb-3"><label class="form-label">Password <small class="text-muted" id="pw-hint">(required)</small></label><input type="password" class="form-control" id="user-password"></div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" id="user-role">
              <option value="cashier">Cashier</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="user-active" checked>
            <label class="form-check-label">Active</label>
          </div>
          <div class="form-check mt-2">
            <input type="checkbox" class="form-check-input" id="user-dash-money">
            <label class="form-check-label" for="user-dash-money">Show today's money on the dashboard</label>
            <div class="form-text" id="user-dash-money-hint"></div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" onclick="saveUser(this)">Save</button></div>
      </div>
    </div>
  </div>

  <!-- A user's pending account: shortages charged to them, and what was paid back or written off. -->
  <div class="modal fade" id="accountModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="acct-title">Account</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="fs-5 mb-2">Owes: <strong id="acct-balance">-</strong></div>
          <div class="row g-2 align-items-end mb-3 border rounded p-2 bg-light">
            <div class="col-md-3"><label class="form-label small mb-1">Record</label>
              <select class="form-select form-select-sm" id="acct-kind">
                <option value="payment">Payment received</option>
                <option value="write_off">Write off</option>
                <option value="charge">Charge (add)</option>
              </select></div>
            <div class="col-md-2"><label class="form-label small mb-1">Amount</label><input type="number" min="0" step="any" class="form-control form-control-sm" id="acct-amount"></div>
            <div class="col-md-5"><label class="form-label small mb-1">Note <span class="text-muted" id="acct-note-hint">(optional)</span></label><input class="form-control form-control-sm" id="acct-note" placeholder="e.g. paid in cash, deducted from salary"></div>
            <div class="col-md-2"><button class="btn btn-sm btn-primary w-100" onclick="saveEntry(this)">Save</button></div>
            <div class="col-12 small text-muted">Nothing is ever edited or deleted. A charge made in error is put right with a write-off that says why.</div>
          </div>
          <div id="acct-ledger"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script src="/public/js/closing.js"></script>
  <script>
    let allUsers = [];
    initApp('/users', loadUsers);

    // What each user owes for shortages charged to them (cashier_ledger).
    let balances = {};
    async function loadUsers() {
      allUsers = await api('/api/settings/users');
      try { balances = Object.fromEntries((await api('/api/cash/accounts')).map(a => [a.user_id, a.balance])); } catch { balances = {}; }
      document.getElementById('users-table').innerHTML = allUsers.map(u => `
        <tr>
          <td class="fw-bold">${u.username}</td>
          <td>${u.full_name}</td>
          <td><span class="badge bg-${u.role === 'admin' ? 'primary' : 'secondary'}">${u.role}</span></td>
          <td><span class="badge bg-${u.is_active ? 'success' : 'danger'}">${u.is_active ? 'Active' : 'Disabled'}</span></td>
          <td>${u.role === 'admin' ? '<span class="text-muted small">Always (admin)</span>' : (u.show_dashboard_money ? '<span class="badge bg-info">Shown</span>' : '<span class="badge bg-light text-dark border">Hidden</span>')}</td>
          <td class="text-end">${(balances[u.id] || 0) > 0 ? `<span class="text-danger fw-bold">${formatCurrency(balances[u.id])}</span>` : '<span class="text-muted">-</span>'}</td>
          <td>${formatDate(u.created_at)}</td>
          <td><button class="btn btn-sm btn-outline-primary" onclick="editUser(${u.id})">Edit</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="openAccount(${u.id})">Account</button></td>
        </tr>
      `).join('');
    }

    function showAddUser() {
      document.getElementById('user-modal-title').textContent = 'Add User';
      document.getElementById('user-id').value = '';
      document.getElementById('user-username').value = '';
      document.getElementById('user-username').disabled = false;
      document.getElementById('user-fullname').value = '';
      document.getElementById('user-password').value = '';
      document.getElementById('pw-hint').textContent = '(required)';
      document.getElementById('user-role').value = 'cashier';
      document.getElementById('user-active').checked = true;
      const dashBox = document.getElementById('user-dash-money');
      dashBox.disabled = false;
      dashBox.checked = false;
      dashBox.dataset.cashierValue = '0';
      syncDashMoneyField();
      new bootstrap.Modal(document.getElementById('userModal')).show();
    }

    // An admin always sees the dashboard money, so for that role the box is
    // shown ticked and locked rather than offering a choice that does nothing.
    // The cashier's own choice is remembered underneath (dataset.cashierValue)
    // so flipping the role to Admin and back does not lose it.
    function syncDashMoneyField() {
      const box = document.getElementById('user-dash-money');
      const isAdmin = document.getElementById('user-role').value === 'admin';
      if (isAdmin) {
        if (!box.disabled) box.dataset.cashierValue = box.checked ? '1' : '0';
        box.checked = true;
        box.disabled = true;
      } else {
        if (box.disabled) box.checked = box.dataset.cashierValue === '1';
        box.disabled = false;
      }
      document.getElementById('user-dash-money-hint').textContent = isAdmin
        ? 'Admins always see today\'s money on the dashboard.'
        : 'Today\'s sales, profit, expenses and money received by method. When off, this cashier\'s dashboard shows only bill counts, stock alerts and recent bills.';
    }
    document.getElementById('user-role').addEventListener('change', syncDashMoneyField);

    function editUser(id) {
      const u = allUsers.find(x => x.id === id);
      document.getElementById('user-modal-title').textContent = 'Edit User';
      document.getElementById('user-id').value = u.id;
      document.getElementById('user-username').value = u.username;
      document.getElementById('user-username').disabled = true;
      document.getElementById('user-fullname').value = u.full_name;
      document.getElementById('user-password').value = '';
      document.getElementById('pw-hint').textContent = '(leave blank to keep current)';
      document.getElementById('user-role').value = u.role;
      document.getElementById('user-active').checked = !!u.is_active;
      const dashBox = document.getElementById('user-dash-money');
      dashBox.disabled = false;
      dashBox.checked = !!u.show_dashboard_money;
      dashBox.dataset.cashierValue = u.show_dashboard_money ? '1' : '0';
      syncDashMoneyField();
      new bootstrap.Modal(document.getElementById('userModal')).show();
    }

    let acctUser = null;
    async function openAccount(id) {
      acctUser = id;
      document.getElementById('acct-amount').value = '';
      document.getElementById('acct-note').value = '';
      await renderAccount();
      bootstrap.Modal.getOrCreateInstance(document.getElementById('accountModal')).show();
    }
    async function renderAccount() {
      const a = await api(`/api/cash/accounts/${acctUser}`);
      document.getElementById('acct-title').textContent = `Pending account — ${a.user.full_name}`;
      const b = document.getElementById('acct-balance');
      b.textContent = formatCurrency(Math.max(0, a.balance));
      b.className = a.balance > 0 ? 'text-danger' : 'text-success';
      document.getElementById('acct-ledger').innerHTML = Closing.ledgerHtml(a.entries || []);
    }
    document.getElementById('acct-kind').addEventListener('change', (e) => {
      document.getElementById('acct-note-hint').textContent = e.target.value === 'payment' ? '(optional)' : '(required)';
    });
    async function saveEntry(btn) {
      const body = {
        kind: document.getElementById('acct-kind').value,
        amount: Number(document.getElementById('acct-amount').value),
        note: document.getElementById('acct-note').value.trim(),
      };
      await withBusy(btn, async () => {
        await api(`/api/cash/accounts/${acctUser}/entries`, { method: 'POST', body });
        showToast('Saved');
        document.getElementById('acct-amount').value = '';
        document.getElementById('acct-note').value = '';
        await renderAccount();
        await loadUsers();
      }, '…');
    }

    async function saveUser(btn) {
      const id = document.getElementById('user-id').value;
      const data = {
        full_name: document.getElementById('user-fullname').value,
        role: document.getElementById('user-role').value,
        is_active: document.getElementById('user-active').checked ? 1 : 0,
      };
      // For an admin the box is locked on; store the cashier choice kept
      // underneath instead, so a later demotion to cashier keeps it.
      const dashBox = document.getElementById('user-dash-money');
      data.show_dashboard_money = dashBox.disabled ? dashBox.dataset.cashierValue === '1' : dashBox.checked;
      const pw = document.getElementById('user-password').value;

      await withBusy(btn, async () => {
        if (id) {
          if (pw) data.password = pw;
          await api(`/api/settings/users/${id}`, { method: 'PUT', body: data });
        } else {
          if (!pw) throw new Error('Password is required for new users');
          data.username = document.getElementById('user-username').value;
          data.password = pw;
          await api('/api/settings/users', { method: 'POST', body: data });
        }
        bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
        showToast('User saved!');
        await loadUsers();
      }, 'Saving...');
    }
  </script>
</body>
</html>

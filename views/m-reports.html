<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e83e8c">
  <title>KUKI · Reports</title>
  <link rel="icon" href="/public/img/kuki_logo.png">
  <link rel="stylesheet" href="/public/css/mobile.css">
</head>
<body>
  <div class="topbar">
    <a href="/m" class="back">‹</a>
    <h1>Reports</h1>
    <a href="/reports?desktop=1" class="right">Desktop</a>
  </div>

  <div class="filters" style="gap:6px;">
    <button class="btn btn-primary btn-sm" id="mode-day-btn" onclick="setMode('day')">Day</button>
    <button class="btn btn-outline btn-sm" id="mode-range-btn" onclick="setMode('range')">Range</button>
  </div>

  <div id="day-controls">
    <div class="filters" style="gap:6px;">
      <button class="btn btn-outline btn-sm" data-range="today" onclick="quickRange('today')">Today</button>
      <button class="btn btn-outline btn-sm" data-range="yesterday" onclick="quickRange('yesterday')">Yesterday</button>
    </div>
    <div class="filters">
      <input type="date" id="filter-date">
      <button class="btn btn-primary btn-sm" onclick="loadReport()">Load</button>
    </div>
  </div>

  <div id="range-controls" style="display:none;">
    <div class="filters" style="gap:6px;">
      <button class="btn btn-outline btn-sm" style="flex:1 1 calc(50% - 3px);" onclick="rangePreset('7d')">Last 7 days</button>
      <button class="btn btn-outline btn-sm" style="flex:1 1 calc(50% - 3px);" onclick="rangePreset('30d')">Last 30 days</button>
      <button class="btn btn-outline btn-sm" style="flex:1 1 calc(50% - 3px);" onclick="rangePreset('month')">This month</button>
      <button class="btn btn-outline btn-sm" style="flex:1 1 calc(50% - 3px);" onclick="rangePreset('lastmonth')">Last month</button>
    </div>
    <div class="filters" style="gap:8px;">
      <label style="flex:1;min-width:0;font-size:0.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;">From
        <input type="date" id="start-date" style="width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:white;">
      </label>
      <label style="flex:1;min-width:0;font-size:0.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;">To
        <input type="date" id="end-date" style="width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:white;">
      </label>
    </div>
    <div class="filters">
      <button class="btn btn-primary btn-sm" onclick="loadRange()">Load</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2 id="report-title">Daily Summary</h2>
      <div id="range-meta" style="display:none;font-size:0.82rem;color:var(--ink-soft);"></div>
      <div id="range-empty" class="empty" style="display:none;">No sales in this range</div>
      <div class="stat-grid">
        <div class="stat-tile"><div class="label">Sales</div><div class="val" id="r-sales">…</div></div>
        <div class="stat-tile"><div class="label">Bills</div><div class="val" id="r-bills">…</div></div>
        <div class="stat-tile"><div class="label">Cost of goods</div><div class="val" id="r-cost">…</div></div>
        <div class="stat-tile"><div class="label">Gross profit</div><div class="val green" id="r-gross">…</div></div>
        <div class="stat-tile"><div class="label">Expenses</div><div class="val red" id="r-exp">…</div></div>
        <div class="stat-tile" id="tile-other" style="display:none;"><div class="label">Other income</div><div class="val green" id="r-other">…</div></div>
        <div class="stat-tile"><div class="label">Net profit</div><div class="val" id="r-net">…</div></div>
        <div class="stat-tile"><div class="label">Disposal loss</div><div class="val red" id="r-disposal">…</div></div>
      </div>
    </div>

    <div class="card" id="disposals-card" style="display:none;">
      <h2>Disposals today</h2>
      <div id="r-disposals"></div>
    </div>

    <div class="card">
      <h2>By payment method</h2>
      <div id="r-payment"><div class="empty">Loading…</div></div>
    </div>

    <div class="card">
      <h2>Products sold<span id="products-count"></span></h2>
      <div id="r-top"><div class="empty">Loading…</div></div>
      <div id="r-top-summary" style="display:none;justify-content:space-between;align-items:baseline;gap:8px;padding-top:10px;"></div>
      <div id="r-top-recon" style="display:none;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);"></div>
      <button class="btn btn-outline btn-sm" id="r-top-toggle" style="display:none;margin-top:12px;" onclick="toggleTop()"></button>
    </div>
  </div>

  <script src="/public/js/mobile.js"></script>
  <script>
    const TOP_VISIBLE = 15;
    let reportMode = 'day';
    let topProducts = [];
    let topRecon = null;
    let topExpanded = false;

    async function load() {
      await bootMobile();
      $('filter-date').value = todayISO();
      loadReport();
    }

    /* ---------- date helpers (business day aware, built on todayISO()) ---------- */
    function addDays(iso, n) {
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + n);
      return dt.toISOString().slice(0, 10);
    }
    function startOfMonth(iso) { return iso.slice(0, 7) + '-01'; }

    /* ---------- mode switch ---------- */
    function setMode(m) {
      reportMode = m;
      $('day-controls').style.display = m === 'day' ? 'block' : 'none';
      $('range-controls').style.display = m === 'range' ? 'block' : 'none';
      $('mode-day-btn').className = 'btn btn-sm ' + (m === 'day' ? 'btn-primary' : 'btn-outline');
      $('mode-range-btn').className = 'btn btn-sm ' + (m === 'range' ? 'btn-primary' : 'btn-outline');
      if (m === 'day') {
        if (!$('filter-date').value) $('filter-date').value = todayISO();
        loadReport();
      } else if (!$('start-date').value || !$('end-date').value) {
        rangePreset('7d');
      } else {
        loadRange();
      }
    }

    function quickRange(r) {
      const today = todayISO();
      $('filter-date').value = r === 'yesterday' ? addDays(today, -1) : today;
      loadReport();
    }

    function rangePreset(p) {
      const today = todayISO();
      let start = today, end = today;
      if (p === '7d') start = addDays(today, -6);
      else if (p === '30d') start = addDays(today, -29);
      else if (p === 'month') start = startOfMonth(today);
      else if (p === 'lastmonth') {
        end = addDays(startOfMonth(today), -1);
        start = startOfMonth(end);
      }
      $('start-date').value = start;
      $('end-date').value = end;
      loadRange();
    }

    /* ---------- shared renderers ---------- */
    function qtyFmt(n) {
      const v = Number(n || 0);
      return Number.isInteger(v) ? String(v) : v.toFixed(2);
    }

    function renderPayment(rows) {
      const list = rows || [];
      if (!list.length) {
        $('r-payment').innerHTML = '<div class="empty">No sales</div>';
        return;
      }
      $('r-payment').innerHTML = list.map(p => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);">
          <span>${(p.payment_method || '').toUpperCase()} <span style="color:var(--ink-soft);font-size:0.85rem;">· ${p.count} bills</span></span>
          <strong>${fmt(p.total)}</strong>
        </div>`).join('');
    }

    /* recon = { discount, tax, totalSales } — bill-level figures the product list cannot show */
    function renderProducts(rows, recon) {
      topProducts = rows || [];
      topRecon = recon || null;
      topExpanded = false;
      drawProducts();
    }

    function toggleTop() {
      topExpanded = !topExpanded;
      drawProducts();
    }

    function drawProducts() {
      const list = topProducts;
      $('products-count').textContent = list.length ? ` (${list.length})` : '';
      if (!list.length) {
        $('r-top').innerHTML = '<div class="empty">No products sold</div>';
        $('r-top-summary').style.display = 'none';
        $('r-top-recon').style.display = 'none';
        $('r-top-toggle').style.display = 'none';
        return;
      }
      const shown = topExpanded ? list : list.slice(0, TOP_VISIBLE);
      $('r-top').innerHTML = shown.map((p, i) => `
        <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:0.9rem;">
          <span><strong>${i + 1}.</strong> ${escapeHtml(p.product_name)} <span style="color:var(--ink-soft);">× ${qtyFmt(p.total_qty)}</span></span>
          <strong style="white-space:nowrap;">${fmt(p.total_revenue)}</strong>
        </div>`).join('');

      /* Totals always cover the FULL list, never just the rows the toggle happens to show. */
      let totalQty = 0, totalRev = 0;
      list.forEach(p => { totalQty += Number(p.total_qty || 0); totalRev += Number(p.total_revenue || 0); });
      $('r-top-summary').style.display = 'flex';
      $('r-top-summary').innerHTML = `
        <span style="min-width:0;font-size:0.85rem;">Gross product value
          <span style="display:block;color:var(--ink-soft);font-size:0.72rem;">(before discount &amp; tax) · ${qtyFmt(totalQty)} items</span>
        </span>
        <strong style="white-space:nowrap;">${fmt(totalRev)}</strong>`;

      drawRecon(totalRev);

      if (list.length > TOP_VISIBLE) {
        $('r-top-toggle').style.display = 'block';
        $('r-top-toggle').textContent = topExpanded ? 'Show less' : `Show all (${list.length})`;
      } else {
        $('r-top-toggle').style.display = 'none';
      }
    }

    /* Reconciles the product list (subtotal only) with the Sales tile (subtotal - discount + tax).
       Always reflects the full product list — the Show all / Show less toggle never touches it. */
    function drawRecon(gross) {
      const box = $('r-top-recon');
      if (!topRecon) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      const discount = Number(topRecon.discount || 0);
      const tax = Number(topRecon.tax || 0);
      const totalSales = Number(topRecon.totalSales || 0);
      const mismatch = Math.abs((gross - discount + tax) - totalSales) > 0.01;

      const rowCss = 'display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;font-size:0.82rem;color:var(--ink-soft);';
      let html = `
        <div style="${rowCss}"><span>Gross product value</span><span style="white-space:nowrap;">${fmt(gross)}</span></div>`;
      if (Math.abs(discount) > 0.005) {
        html += `
        <div style="${rowCss}"><span>less discounts</span><span style="white-space:nowrap;">− ${fmt(discount)}</span></div>`;
      }
      if (Math.abs(tax) > 0.005) {
        html += `
        <div style="${rowCss}"><span>plus tax</span><span style="white-space:nowrap;">+ ${fmt(tax)}</span></div>`;
      }
      html += `
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;padding-top:7px;border-top:1px solid var(--line);font-size:0.92rem;font-weight:700;${mismatch ? 'color:var(--red);' : ''}">
          <span>= Total sales</span><span style="white-space:nowrap;">${fmt(totalSales)}</span>
        </div>`;
      if (mismatch) {
        html += `
        <div style="padding-top:4px;font-size:0.74rem;color:var(--red);">Doesn't add up — check bill discounts &amp; tax.</div>`;
      }
      box.innerHTML = html;
      box.style.display = 'block';
    }

    /* ---------- day mode ---------- */
    async function loadReport() {
      try {
        const date = $('filter-date').value || todayISO();
        $('report-title').textContent = 'Report — ' + formatDate(date);
        $('range-meta').style.display = 'none';
        $('range-empty').style.display = 'none';
        $('tile-other').style.display = 'none';
        const r = await api(`/api/reports/daily?date=${date}`);
        $('r-sales').textContent = fmt(r.sales.total_sales);
        $('r-bills').textContent = r.sales.bill_count;
        $('r-cost').textContent = fmt(r.cost_of_goods);
        $('r-gross').textContent = fmt(r.gross_profit);
        $('r-gross').className = 'val ' + (r.gross_profit >= 0 ? 'green' : 'red');
        $('r-exp').textContent = fmt(r.expenses);
        const net = r.gross_profit - r.expenses;
        $('r-net').textContent = fmt(net);
        $('r-net').className = 'val ' + (net >= 0 ? 'green' : 'red');
        $('r-disposal').textContent = fmt(r.disposal_loss || 0);
        if (r.disposals && r.disposals.length) {
          $('disposals-card').style.display = 'block';
          $('r-disposals').innerHTML = r.disposals.map(d => `
            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:0.9rem;">
              <span>${escapeHtml(d.product_name)} <span style="color:var(--ink-soft);">× ${d.quantity}</span>${d.reason ? ` <small style="color:var(--ink-soft);">— ${escapeHtml(d.reason)}</small>` : ''}</span>
              <strong style="color:var(--red);">-${fmt(d.cost_loss)}</strong>
            </div>`).join('');
        } else {
          $('disposals-card').style.display = 'none';
        }

        renderPayment(r.by_payment);
        renderProducts(r.top_products, {
          discount: r.sales.total_discount,
          tax: r.sales.total_tax,
          totalSales: r.sales.total_sales
        });
      } catch (err) { toast(err.message, 'error'); }
    }

    /* ---------- range mode ---------- */
    async function loadRange() {
      try {
        let start = $('start-date').value || todayISO();
        let end = $('end-date').value || todayISO();
        if (start > end) {
          const swap = start; start = end; end = swap;
          $('start-date').value = start;
          $('end-date').value = end;
        }
        const r = await api(`/api/reports/range?start_date=${start}&end_date=${end}`);
        const days = r.days || 1;
        const from = formatDate(r.start_date || start);
        const to = formatDate(r.end_date || end);
        $('report-title').textContent = 'Range summary';
        $('range-meta').style.display = 'block';
        $('range-meta').textContent = `${from} — ${to} · ${days} day${days === 1 ? '' : 's'}`;
        $('disposals-card').style.display = 'none';
        $('tile-other').style.display = 'block';

        const sales = r.sales || {};
        const expenses = (r.expenses && r.expenses.total) || 0;
        $('r-sales').textContent = fmt(sales.total_sales);
        $('r-bills').textContent = sales.bill_count || 0;
        $('r-cost').textContent = fmt(r.cost_of_goods);
        $('r-gross').textContent = fmt(r.gross_profit);
        $('r-gross').className = 'val ' + (r.gross_profit >= 0 ? 'green' : 'red');
        $('r-exp').textContent = fmt(expenses);
        $('r-other').textContent = fmt(r.other_income);
        $('r-net').textContent = fmt(r.net_profit);
        $('r-net').className = 'val ' + (r.net_profit >= 0 ? 'green' : 'red');
        $('r-disposal').textContent = fmt(r.disposal_loss || 0) + (r.disposal_count ? ` · ${r.disposal_count}` : '');

        $('range-empty').textContent = `No sales between ${from} and ${to}`;
        $('range-empty').style.display = (sales.bill_count || 0) ? 'none' : 'block';

        renderPayment(r.by_payment);
        renderProducts(r.top_products, {
          discount: sales.total_discount,
          tax: sales.total_tax,
          totalSales: sales.total_sales
        });
      } catch (err) { toast(err.message, 'error'); }
    }

    load();
  </script>
</body>
</html>

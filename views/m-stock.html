<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e83e8c">
  <title>KUKI · Stock</title>
  <link rel="icon" href="/public/img/kuki_logo.png">
  <link rel="stylesheet" href="/public/css/mobile.css">
</head>
<body>
  <div class="topbar">
    <a href="/m" class="back">‹</a>
    <h1>Stock</h1>
    <a href="/stock?desktop=1" class="right">Desktop</a>
  </div>
  <div class="filters">
    <input type="text" id="s-search" placeholder="Search stock items…">
    <select id="s-cat"><option value="">All categories</option></select>
  </div>
  <div style="background:white;padding:12px 14px 4px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;">Stock Items</div>
  <div id="stock-list"><div class="empty">Loading…</div></div>

  <div id="tracked-section" style="display:none;">
    <div style="background:white;padding:12px 14px 4px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;border-top:8px solid var(--bg);">Tracked Products <span style="text-transform:none;letter-spacing:0;font-weight:400;">(from product list)</span></div>
    <div style="padding:8px 14px;background:white;border-bottom:1px solid var(--line);">
      <select id="prod-cat-filter" onchange="renderTracked()" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:white;"><option value="">All product categories</option></select>
    </div>
    <div id="tracked-list"></div>
  </div>

  <!-- Held stock: what open carts are reserving right now -->
  <div id="holds-section">
    <div style="background:white;padding:12px 14px 4px;border-top:8px solid var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;">Held Stock</span>
      <button class="btn btn-outline btn-sm" id="holds-refresh" style="width:auto;flex:0 0 auto;" onclick="refreshHolds(this)">Refresh</button>
    </div>
    <div id="holds-note" style="background:white;padding:2px 14px 10px;font-size:0.76rem;color:var(--ink-soft);border-bottom:1px solid var(--line);"></div>
    <!-- Admin cleanup control (the bulk "unreported holds" release), filled by
         renderUnreportedControl(). Left empty for cashiers, so the section looks
         exactly as it did for them. -->
    <div id="holds-bulk"></div>
    <div id="holds-list"></div>
  </div>

  <!-- Adjust stock (tracked products) - same sheet as on the mobile Products
       page. Every change to a tracked product's count goes through
       POST /api/products/:id/stock-adjust and shows in Stock History. -->
  <div class="sheet" id="adj-sheet" onclick="if(event.target===this)closeSheet('adj-sheet')">
    <div class="sheet-inner">
      <div class="sheet-handle"></div>
      <h3 id="adj-title">Adjust stock</h3>
      <input type="hidden" id="adj-id">
      <div style="font-size:0.9rem;margin-bottom:10px;">On hand now: <strong id="adj-onhand">0</strong></div>
      <div class="field">
        <label>What happened?</label>
        <select id="adj-type" onchange="onAdjustTypeChange()">
          <option value="received">Received / baked — adds</option>
          <option value="waste">Waste — removes</option>
          <option value="count">Count — sets to what you counted</option>
        </select>
        <div id="adj-help" style="color:var(--ink-soft);font-size:0.76rem;margin-top:4px;"></div>
      </div>
      <div class="field"><label id="adj-qty-label">How many?</label><input type="number" id="adj-qty" min="0" step="1" inputmode="numeric" oninput="updateAdjustPreview()"></div>
      <div class="field"><label id="adj-reason-label">Reason</label><input type="text" id="adj-reason"></div>
      <div id="adj-preview" style="font-weight:700;font-size:0.9rem;margin-bottom:8px;"></div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet('adj-sheet')">Cancel</button>
        <button class="btn btn-primary" onclick="saveAdjust(this)">Save</button>
      </div>
    </div>
  </div>

  <button class="fab" id="fab" onclick="openAdd()" style="display:none;">+</button>

  <!-- Edit / adjust sheet -->
  <div class="sheet" id="stock-sheet" onclick="if(event.target===this)closeSheet('stock-sheet')">
    <div class="sheet-inner">
      <div class="sheet-handle"></div>
      <h3 id="sh-title">Stock item</h3>
      <input type="hidden" id="s-id">
      <div class="field"><label>Name</label><input type="text" id="s-name"></div>
      <div class="field"><label>Category</label><select id="s-cat-sel"></select></div>
      <div class="field"><label>Unit (kg, L, pcs)</label><input type="text" id="s-unit"></div>
      <!-- Editable only for a NEW item (its opening quantity). Saving an existing
           item never changes its quantity — the server ignores it — so the box
           is locked then and the movement form below is the way to change it. -->
      <div class="field"><label id="s-qty-label">Opening quantity</label><input type="number" id="s-qty" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Cost per unit (Rs.)</label><input type="number" id="s-cost" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Reorder level</label><input type="number" id="s-reorder" min="0" step="any" inputmode="decimal"></div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet('stock-sheet')">Cancel</button>
        <button class="btn btn-primary" onclick="saveItem(this)">Save</button>
      </div>
      <button class="btn btn-danger" id="s-delete" style="display:none;margin-top:8px;" onclick="deleteStockItem(this)">Delete this stock item</button>
      <hr style="margin:18px 0;border:none;border-top:1px solid var(--line);">
      <h3 style="font-size:0.95rem;">Quick stock movement</h3>
      <!-- The type decides the direction; the quantity is always a plain amount
           (or, for Count, the figure counted). -->
      <div class="field">
        <label>Type</label>
        <select id="tx-type" onchange="onTxTypeChange()">
          <option value="purchase">Purchase — adds to stock</option>
          <option value="usage">Used — removes from stock</option>
          <option value="waste">Waste — removes from stock</option>
          <option value="adjustment">Count — sets stock to what you counted</option>
        </select>
        <div id="tx-help" style="color:var(--ink-soft);font-size:0.76rem;margin-top:4px;"></div>
      </div>
      <div class="field"><label id="tx-qty-label">Quantity</label><input type="number" id="tx-qty" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>Reference (optional)</label><input type="text" id="tx-ref" placeholder="e.g., supplier #123"></div>
      <button class="btn btn-success" onclick="addTx(this)">Record movement</button>
    </div>
  </div>

  <script src="/public/js/mobile.js"></script>
  <script>
    let items = [], cats = [], tracked = [], holds = [];

    // The server's answer to "which holds is nothing reporting any more?" —
    // { count, carts, quantity, threshold_minutes, hold_ids, holds }. null means
    // we have not got one (a cashier, or the request failed). This screen never
    // works that set out for itself: it shows what the server listed and posts
    // back those exact ids.
    let unreportedPreview = null;

    // A hold has no expiry by design (the owner rejected auto-release), so a cart
    // killed by a closed tab or a flat battery strands its stock forever. Three
    // hours is the line: a cart only exists once the customer has confirmed the
    // order, and a confirmed order at this counter is paid within minutes, so
    // nothing live survives an afternoon. Highlight only — nothing is released
    // for you. Kept in step with the same constant in views/stock.html.
    const HOLD_STALE_HOURS = 3;

    // How long a claiming till may go quiet before this screen stops reading its
    // claim as live. An EMPHASIS threshold only: either side of it the row prints
    // the same fact ("checked in 2d ago"), so a badly chosen number changes how
    // loud a row looks and never what it asserts. Kept in step with views/stock.html.
    const CLAIM_STALE_MINUTES = 30;

    async function load() {
      await bootMobile();
      if (currentUser.role !== 'admin') { $('fab').style.display = 'none'; toast('Read-only — admin needed to edit'); }
      else $('fab').style.display = 'block';
      const [stocks, allCats, prods, activeHolds] = await Promise.all([
        api('/api/stock/items'),
        api('/api/stock/categories'),
        api('/api/products'),
        api('/api/pos/reservations'),
      ]);
      items = stocks; cats = allCats; holds = activeHolds;
      await loadUnreportedPreview();
      tracked = prods.filter(p => p.is_active && p.track_stock);
      const catOpts = '<option value="">All categories</option>' + cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      $('s-cat').innerHTML = catOpts;
      $('s-cat-sel').innerHTML = cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      render();
      renderTracked();
      renderHolds();
      $('s-search').addEventListener('input', () => { render(); renderTracked(); });
      $('s-cat').addEventListener('change', render);
    }

    function renderTracked() {
      const sec = $('tracked-section');
      if (!tracked.length) { sec.style.display = 'none'; return; }
      // Populate the product-category select (preserves selection across re-renders)
      const filter = $('prod-cat-filter');
      const cats = sortCategoriesPOS([...new Set(tracked.map(p => p.category).filter(Boolean))]);
      const prev = filter.value;
      filter.innerHTML = '<option value="">All product categories</option>' +
        cats.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${escapeHtml(c)}</option>`).join('');
      if (prev) filter.value = prev;
      const catFilter = filter.value;
      const q = $('s-search').value.toLowerCase().trim();
      const list = tracked.filter(p => {
        if (catFilter && (p.category || '').toLowerCase() !== catFilter.toLowerCase()) return false;
        if (q && !(p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q))) return false;
        return true;
      });
      sec.style.display = 'block';
      if (!list.length) { $('tracked-list').innerHTML = '<div class="empty">No matches</div>'; return; }
      $('tracked-list').innerHTML = list.map(p => {
        const out = p.stock_quantity <= 0;
        const low = !out && p.stock_reorder_level > 0 && p.stock_quantity <= p.stock_reorder_level;
        const status = out ? '<span class="badge danger">OUT</span>' : low ? '<span class="badge warning">LOW</span>' : '';
        return `<div class="list-item" onclick="openAdjust(${p.id})">
          <div class="list-head">
            <span class="list-title">${escapeHtml(p.name)} ${status}</span>
            <span class="list-amount" style="color:${out ? 'var(--red)' : (low ? '#92400e' : 'var(--ink)')};">${p.stock_quantity}</span>
          </div>
          <div class="list-meta">${escapeHtml(p.category || '-')} · min ${p.stock_reorder_level} · tap to add, dispose or count</div>
        </div>`;
      }).join('');
    }

    // ===== Adjust stock (tracked products) =====
    // Same flow and wording as the Adjust stock sheet on the mobile Products page.
    const ADJUST_TEXT = {
      received: { help: 'Freshly baked or delivered. Adds to what is on hand.', qty: 'How many came in?', reason: 'Note (optional)', placeholder: 'e.g., morning bake' },
      waste: { help: 'Thrown away (expired, damaged). Removes from on hand; counted as a loss at cost price in the reports.', qty: 'How many were thrown away?', reason: 'Reason (required)', placeholder: 'e.g., expired' },
      count: { help: 'You counted the shelf. On hand is SET to your count; the difference is recorded.', qty: 'How many did you count?', reason: 'Reason (required)', placeholder: 'e.g., end-of-day count' },
    };

    function adjProduct() {
      return tracked.find(x => x.id === parseInt($('adj-id').value));
    }

    function openAdjust(id) {
      const p = tracked.find(x => x.id === id);
      if (!p) return;
      if (currentUser.role !== 'admin') { toast('Admin needed to change stock', 'error'); return; }
      $('adj-id').value = p.id;
      $('adj-title').textContent = 'Adjust stock · ' + p.name;
      $('adj-onhand').textContent = p.stock_quantity || 0;
      $('adj-type').value = 'received';
      $('adj-qty').value = '';
      $('adj-reason').value = '';
      onAdjustTypeChange();
      openSheet('adj-sheet');
    }

    function onAdjustTypeChange() {
      const t = ADJUST_TEXT[$('adj-type').value];
      $('adj-help').textContent = t.help;
      $('adj-qty-label').textContent = t.qty;
      $('adj-reason-label').textContent = t.reason;
      $('adj-reason').placeholder = t.placeholder;
      updateAdjustPreview();
    }

    function updateAdjustPreview() {
      const p = adjProduct();
      const el = $('adj-preview');
      const raw = $('adj-qty').value;
      const qty = parseFloat(raw);
      if (!p || raw === '' || !Number.isFinite(qty)) { el.textContent = ''; return; }
      const onHand = p.stock_quantity || 0;
      const type = $('adj-type').value;
      const next = type === 'received' ? onHand + qty : type === 'waste' ? onHand - qty : qty;
      el.style.color = next < 0 ? 'var(--red)' : 'var(--ink)';
      el.textContent = next < 0 ? `Only ${onHand} on hand — cannot throw away ${qty}.` : `On hand: ${onHand} → ${next}`;
    }

    async function saveAdjust(btn) {
      const p = adjProduct();
      if (!p) return;
      const type = $('adj-type').value;
      const raw = $('adj-qty').value;
      const qty = parseFloat(raw);
      const reason = $('adj-reason').value.trim();
      if (raw === '' || !Number.isFinite(qty)) { toast('Enter a quantity', 'error'); return; }
      if (type !== 'count' && qty <= 0) { toast('Quantity must be greater than zero', 'error'); return; }
      if (qty < 0) { toast('The count cannot be negative', 'error'); return; }
      if (type !== 'received' && !reason) { toast('Enter a reason', 'error'); return; }
      await withBusy(btn, async () => {
        const r = await api(`/api/products/${p.id}/stock-adjust`, { method: 'POST', body: { type, quantity: qty, reason } });
        closeSheet('adj-sheet');
        toast(`Stock ${r.previous} → ${r.stock_quantity}${r.cost_loss ? ` — loss ${fmt(r.cost_loss)}` : ''}`);
        load();
      }, 'Saving…');
    }

    function render() {
      const q = $('s-search').value.toLowerCase().trim();
      const catId = $('s-cat').value;
      const filtered = items.filter(it => {
        if (q && !it.name.toLowerCase().includes(q)) return false;
        if (catId && String(it.category_id) !== catId) return false;
        return true;
      });
      if (!filtered.length) { $('stock-list').innerHTML = '<div class="empty">No items</div>'; return; }
      const isAdmin = currentUser.role === 'admin';
      $('stock-list').innerHTML = filtered.map(it => {
        const low = it.reorder_level > 0 && it.quantity <= it.reorder_level;
        return `<div class="list-item" ${isAdmin ? `onclick="editItem(${it.id})"` : ''}>
          <div class="list-head">
            <span class="list-title">${escapeHtml(it.name)}${low ? ' <span class="badge danger">LOW</span>' : ''}</span>
            <span class="list-amount" style="color:${low ? 'var(--red)' : 'var(--ink)'};">${it.quantity} ${escapeHtml(it.unit || '')}</span>
          </div>
          <div class="list-meta">${escapeHtml(it.category_name || '-')} · cost ${fmt(it.cost_per_unit)} / ${escapeHtml(it.unit || 'u')} · min ${it.reorder_level}</div>
        </div>`;
      }).join('');
    }

    function openAdd() {
      $('sh-title').textContent = 'New stock item';
      $('s-id').value = '';
      ['s-name', 's-unit', 's-qty', 's-cost', 's-reorder', 'tx-qty', 'tx-ref'].forEach(id => $(id).value = '');
      $('s-qty').disabled = false;
      $('s-qty-label').textContent = 'Opening quantity';
      $('tx-type').value = 'purchase';
      onTxTypeChange();
      if (cats[0]) $('s-cat-sel').value = cats[0].id;
      $('s-delete').style.display = 'none';   // nothing to delete yet
      openSheet('stock-sheet');
    }
    function editItem(id) {
      const it = items.find(x => x.id === id);
      $('sh-title').textContent = 'Edit · ' + it.name;
      $('s-id').value = it.id;
      $('s-name').value = it.name;
      $('s-cat-sel').value = it.category_id || (cats[0] && cats[0].id);
      $('s-unit').value = it.unit || '';
      $('s-qty').value = it.quantity;
      $('s-qty').disabled = true;
      $('s-qty-label').textContent = 'Quantity on hand (change it with a movement below)';
      $('s-cost').value = it.cost_per_unit || 0;
      $('s-reorder').value = it.reorder_level || 0;
      ['tx-qty', 'tx-ref'].forEach(id => $(id).value = '');
      $('tx-qty').step = qtyStep(it.unit);
      $('tx-type').value = 'purchase';
      onTxTypeChange();
      $('s-delete').style.display = currentUser.role === 'admin' ? 'block' : 'none';
      openSheet('stock-sheet');
    }
    // Deleting also removes the item's movement history, so the server answers
    // 409 first and we ask again naming the count. Items used by a recipe are
    // refused outright (400) and must be removed from the recipe first.
    async function deleteStockItem(btn) {
      const id = $('s-id').value;
      if (!id) return;
      const label = $('s-name').value || 'this stock item';
      if (!confirm('Delete "' + label + '"? This cannot be undone.')) return;
      await withBusy(btn, async () => {
        let res;
        try {
          res = await api('/api/stock/items/' + id, { method: 'DELETE' });
        } catch (err) {
          if (err && err.data && err.data.needs_confirm) {
            if (!confirm(err.message + ' Delete it anyway?')) return;
            res = await api('/api/stock/items/' + id + '?force=1', { method: 'DELETE' });
          } else {
            throw err;
          }
        }
        closeSheet('stock-sheet');
        toast('Deleted ' + res.deleted);
        await load();
      }, 'Deleting…');
    }

    async function saveItem(btn) {
      const id = $('s-id').value;
      const body = {
        name: $('s-name').value.trim(),
        category_id: parseInt($('s-cat-sel').value) || null,
        unit: $('s-unit').value.trim(),
        quantity: parseFloat($('s-qty').value) || 0,
        cost_per_unit: parseFloat($('s-cost').value) || 0,
        reorder_level: parseFloat($('s-reorder').value) || 0,
      };
      if (!body.name) { toast('Name required', 'error'); return; }
      await withBusy(btn, async () => {
        if (id) await api(`/api/stock/items/${id}`, { method: 'PUT', body });
        else await api('/api/stock/items', { method: 'POST', body });
        closeSheet('stock-sheet');
        toast('Saved');
        items = await api('/api/stock/items');
        render();
      }, 'Saving…');
    }
    // This sheet deliberately stays open after a movement so several movements can
    // be entered in a row, so the busy guard below is the ONLY thing stopping a
    // repeat tap from moving the stock twice. On success we also clear the inputs
    // immediately, so a tap after the guard releases hits the "enter a quantity"
    // check instead of re-sending the same movement.
    async function addTx(btn) {
      const id = $('s-id').value;
      if (!id) { toast('Save the item first', 'error'); return; }
      const raw = $('tx-qty').value;
      const qty = parseFloat(raw);
      const type = $('tx-type').value;
      if (raw === '' || !Number.isFinite(qty)) { toast('Enter a quantity', 'error'); return; }
      if (type !== 'adjustment' && qty <= 0) { toast('Quantity must be greater than zero', 'error'); return; }
      if (qty < 0) { toast('The counted quantity cannot be negative', 'error'); return; }
      const reference = $('tx-ref').value.trim() || null;
      await withBusy(btn, async () => {
        const r = await api(`/api/stock/items/${id}/transaction`, { method: 'POST', body: { type, quantity: qty, reference } });
        $('tx-qty').value = '';
        $('tx-ref').value = '';
        items = await api('/api/stock/items');
        const it = items.find(x => x.id === parseInt(id));
        if (it) { $('s-qty').value = it.quantity; }
        // r.quantity is the signed movement the server recorded (for a count,
        // the difference), so the toast says what actually happened.
        const moved = r.unchanged ? 'Count matches — nothing changed' : `Recorded ${r.quantity > 0 ? '+' : ''}${Math.round(r.quantity * 1000) / 1000}`;
        toast(`${moved}${it ? ` — on hand ${it.quantity}` : ''}`);
        render();
      }, 'Recording…');
    }

    // Counted things (pcs, boxes…) step by whole units; weights and volumes
    // (kg, g, l, ml…) take decimals. Either way the arrows move by 1. Kept in
    // step with views/stock.html.
    function qtyStep(unit) {
      return /^(pcs?|pieces?|nos?|units?|each|ea|box(es)?|packs?|packets?|bags?|bottles?|cans?|trays?|dozens?|doz)$/i.test(String(unit || '').trim()) ? '1' : 'any';
    }

    const TX_TEXT = {
      purchase: { help: 'Bought or delivered. Adds to what is on hand.', qty: 'Quantity received' },
      usage: { help: 'Used in the kitchen. Removes from what is on hand.', qty: 'Quantity used' },
      waste: { help: 'Thrown away (spoiled, spilled, expired). Removes from what is on hand.', qty: 'Quantity thrown away' },
      adjustment: { help: 'You counted it. On hand is SET to the figure you enter; the difference is recorded.', qty: 'Counted quantity on hand' },
    };
    function onTxTypeChange() {
      const t = TX_TEXT[$('tx-type').value];
      const unit = $('s-unit').value.trim();
      $('tx-help').textContent = t.help;
      $('tx-qty-label').textContent = t.qty + (unit ? ` (${unit})` : '');
    }

    // ===== Held stock (cart reservations) =====
    // Listing holds is open to any logged-in user; releasing someone else's hold
    // is adminOnly on the server, so the Release button is rendered for admins
    // only — this page already runs read-only for a cashier, and a button that
    // can only ever return 403 is worse than a line of text saying who can.

    // Relative age, e.g. "2h 14m". parseDbDate() (mobile.js) tags the SQLite
    // timestamp as UTC first; subtracting a raw string would read 5h30m out in
    // Colombo and hide every stale hold.
    function heldFor(created_at) {
      const dt = parseDbDate(created_at);
      if (!dt) return { text: 'unknown', hours: 0 };
      const mins = Math.max(0, Math.floor((Date.now() - dt.getTime()) / 60000));
      const h = Math.floor(mins / 60);
      return { text: h > 0 ? `${h}h ${mins % 60}m` : `${mins}m`, hours: mins / 60 };
    }

    // What, if anything, is standing behind this hold:
    //   unsupported - no claim field in the response (older server); age is the
    //                 only evidence, exactly as before.
    //   unclaimed   - the server reports no till for this cart (claim: null).
    //   active      - a till has that cart open on screen right now.
    //   parked      - a till is holding it as a parked order.
    // A till shut off for the night stops checking in, and its parked cart is
    // still a real customer's order, so a missing or long-ago check-in is
    // reported as the fact it is. Nothing here calls a hold "stranded".
    function claimOf(h) {
      if (!h || !('claim' in h)) return { kind: 'unsupported' };
      const c = h.claim;
      if (!c) return { kind: 'unclaimed' };
      // Via heldFor() so last_seen_at goes through parseDbDate() too; a raw
      // Date() on the SQLite string would read 5h30m out in Colombo.
      const seen = heldFor(c.last_seen_at);
      const unknown = seen.text === 'unknown';
      const mins = seen.hours * 60;
      // heldFor() stops at hours, which reads badly for a till that went quiet
      // days ago ("checked in 48h 0m ago"), so roll days up here rather than
      // touching the "held 2h 14m" age line that uses heldFor() directly.
      const days = Math.floor(seen.hours / 24);
      const gap = days >= 1
        ? `${days}d${seen.hours % 24 >= 1 ? ' ' + Math.floor(seen.hours % 24) + 'h' : ''}`
        : seen.text;
      return {
        // Anything that is not 'active' shows as parked: the cautious reading,
        // because a parked cart is the one it would hurt to release.
        kind: c.state === 'active' ? 'active' : 'parked',
        till: c.till_label || c.till_id || 'unnamed till',
        who: c.user_name || '',
        seenText: unknown ? 'check-in time unknown' : (mins < 1 ? 'checked in just now' : `checked in ${gap} ago`),
        seenStale: unknown || mins >= CLAIM_STALE_MINUTES,
        // The parked bill's own name - a customer ("Mrs Perera") or whatever the
        // cashier typed ("Birthday - Fernando"). `parked_label` and `label` are
        // aliases of each other on the server; trimmed, so a blank label counts as
        // no label and the line falls back to exactly what it said before.
        label: String(c.parked_label ?? c.label ?? '').trim(),
      };
    }

    // One severity per row (0 calm, 1 look at this, 2 loud) so the age signal and
    // the claim signal never shout past each other. The 3h age rule was only ever
    // a proxy for "no till is behind this"; a live check-in is direct evidence and
    // supersedes it, so a parked order claimed seconds ago stays calm however old
    // it is, and the red row now means "old AND nothing claiming it".
    function holdSeverity(claim, age) {
      const old = age.hours >= HOLD_STALE_HOURS;
      if (claim.kind === 'unsupported') return old ? 2 : 0;
      if (claim.kind === 'unclaimed') return old ? 2 : 1;
      return claim.seenStale ? 1 : 0;
    }

    function claimLines(claim) {
      // Older server: no claim line at all, so the card reads as it always did.
      if (claim.kind === 'unsupported') return '';
      if (claim.kind === 'unclaimed') {
        return '<div class="list-meta" style="color:var(--red);font-weight:600;">No till is reporting this cart</div>'
          + '<div class="list-meta">Check the tills before releasing — a till that is switched off still holds its parked orders.</div>';
      }
      const badge = claim.kind === 'active'
        ? '<span class="badge success">Cart open</span>'
        : '<span class="badge info">Parked order</span>';
      // Name the bill beside the badge: "Parked order - Mrs Perera" tells the
      // owner whose cake this is and whether to go and ask about it, which
      // "Parked order" on its own does not. Escaped, because this is a
      // cashier-typed customer name. An empty or absent label leaves the line
      // exactly as it reads today rather than printing a bare separator.
      const bill = claim.kind === 'parked' && claim.label
        ? ` <b>· ${escapeHtml(claim.label)}</b>`
        : '';
      const who = claim.who
        ? `${escapeHtml(claim.till)} · ${escapeHtml(claim.who)}`
        : escapeHtml(claim.till);
      // A dot rather than a space once the bill is named, so the name does not
      // run into the till that is holding it on this 360px line. Without a
      // label the line is byte-for-byte what it was before.
      const sep = bill ? ' · ' : ' ';
      return `<div class="list-meta">${badge}${bill}${sep}${who}</div>`
        + `<div class="list-meta"${claim.seenStale ? ' style="color:var(--amber);font-weight:600;"' : ''}>${escapeHtml(claim.seenText)}</div>`;
    }

    function renderHolds() {
      const note = $('holds-note');
      const list = $('holds-list');
      const isAdmin = currentUser.role === 'admin';
      renderUnreportedControl();

      if (!holds.length) {
        note.textContent = '';
        list.innerHTML = '<div class="empty">No stock is currently held — every tracked item is free to sell.</div>';
        return;
      }

      const claims = holds.map(h => claimOf(h));
      const stale = holds.filter(h => heldFor(h.created_at).hours >= HOLD_STALE_HOURS).length;
      const noClaimField = claims.filter(c => c.kind === 'unsupported').length;

      if (noClaimField === holds.length) {
        // Server has not shipped the claim field yet: age is all we know, so say
        // exactly what this screen has always said.
        note.innerHTML = stale
          ? `<b style="color:var(--red);">${stale} hold${stale === 1 ? '' : 's'} older than ${HOLD_STALE_HOURS}h.</b> A live cart is paid within minutes, so these were probably stranded by a closed tab or a flat tablet. Releasing one puts its stock back on sale.`
          : `${holds.length} live hold${holds.length === 1 ? '' : 's'}. Nothing older than ${HOLD_STALE_HOURS}h.`;
      } else {
        const unclaimed = claims.filter(c => c.kind === 'unclaimed').length;
        const quiet = claims.filter(c => c.seenStale).length;
        const parts = [`${holds.length} live hold${holds.length === 1 ? '' : 's'}.`];
        if (unclaimed) parts.push(`<b style="color:var(--red);">${unclaimed} that no till is reporting.</b> A till switched off for the night still holds its parked orders, so check the tills before releasing one — releasing a parked cart loses a real customer's order.`);
        if (quiet) parts.push(`<b style="color:var(--amber);">${quiet} claimed by a till that has not checked in for over ${CLAIM_STALE_MINUTES}m.</b>`);
        if (noClaimField) parts.push(`${noClaimField} with no claim information — age is all we know for those.`);
        if (!unclaimed && !quiet) parts.push('Every hold has a till checking in for it.');
        note.innerHTML = parts.join(' ');
      }

      list.innerHTML = holds.map((h, i) => {
        const age = heldFor(h.created_at);
        const claim = claims[i];
        const sev = holdSeverity(claim, age);
        const tint = sev === 2 ? ' style="background:#fff5f5;"' : sev === 1 ? ' style="background:#fffbeb;"' : '';
        const name = escapeHtml(h.product_name || `Product #${h.product_id}`);
        return `<div class="list-item"${tint}>
          <div class="list-head">
            <span class="list-title">${name}${sev === 2 ? ' <span class="badge danger">Stale</span>' : ''}</span>
            <span class="list-amount">${h.quantity}</span>
          </div>
          <div class="list-meta" style="word-break:break-all;">cart ${escapeHtml(h.cart_id || '-')} · ${escapeHtml(h.cashier_name || '-')}</div>
          <div class="list-meta"${sev === 2 ? ' style="color:var(--red);font-weight:600;"' : ''}>held ${escapeHtml(age.text)} · ${escapeHtml(formatDateTime(h.created_at))}</div>
          ${claimLines(claim)}
          ${isAdmin
            ? `<button class="btn btn-danger btn-sm" style="margin-top:8px;" onclick="releaseStockHold(${h.id}, this)">Release</button>`
            : '<div class="list-meta">Admin needed to release</div>'}
        </div>`;
      }).join('');
    }

    async function refreshHolds(btn) {
      await withBusy(btn, async () => {
        holds = await api('/api/pos/reservations');
        // Together, so the cleanup button's count can never be staler than the
        // list printed beside it.
        await loadUnreportedPreview();
        renderHolds();
      }, 'Refreshing…');
    }

    // confirm() sits OUTSIDE withBusy on purpose: the guard exists to stop a
    // second tap while the DELETE is in flight, and a modal prompt inside it
    // would hold the button disabled for as long as the dialog stayed open.
    async function releaseStockHold(id, btn) {
      const h = holds.find(x => x.id === id);
      if (!h) return;
      const name = h.product_name || `product #${h.product_id}`;
      if (!confirm(`Release the hold on ${h.quantity} x "${name}" from cart ${h.cart_id}?\n\nThe stock goes back on sale immediately. If that cart is still live at another till, its sale will fail.`)) return;
      await withBusy(btn, async () => {
        await api(`/api/pos/reservations/${id}`, { method: 'DELETE' });
        toast(`Released ${h.quantity} x ${name}`);
        load();
      }, 'Releasing…');
    }

    // ===== Releasing the holds nothing is reporting any more =====
    //
    // Holds never expire by design, so a cart abandoned part-way through ringing
    // up (closed tab, sleeping tablet, end of shift) keeps its stock forever: it
    // was never parked, so it never appears in the parked list, and nothing ever
    // reclaims it. This is the owner's manual cleanup for exactly that — a
    // button, never a timer.
    //
    // The rule lives on the server (GET /api/pos/reservations/unreported): no
    // parked bill owns the cart AND no till has checked in for it recently. This
    // screen deliberately does NOT re-derive it from `claim` — that would be a
    // second definition, free to drift from the one the server deletes by, and
    // this section would start promising something it is not showing.
    async function loadUnreportedPreview() {
      // adminOnly on the server, exactly like the release and the per-row
      // Release button, so a cashier is never asked for it.
      if (currentUser.role !== 'admin') { unreportedPreview = null; return; }
      try {
        unreportedPreview = await api('/api/pos/reservations/unreported');
      } catch (err) {
        // A failed preview must never take the Held stock list down with it —
        // the per-row Release is the thing that always has to keep working.
        unreportedPreview = null;
        console.error('Could not check for unreported holds', err);
      }
    }

    // The preview, as plain lines for the confirm dialog: product, quantity,
    // cart, age and why it qualified. claimOf()/heldFor() are reused so these
    // read exactly like the cards below.
    function unreportedLines(preview, max) {
      const lines = preview.holds.slice(0, max).map(h => {
        const claim = claimOf(h);
        const why = claim.kind === 'unclaimed' || claim.kind === 'unsupported'
          ? 'no till reporting it'
          : `${claim.till} ${claim.seenText}`;
        const name = h.product_name || `product #${h.product_id}`;
        return `- ${h.quantity} x ${name}\n  cart ${h.cart_id}\n  held ${heldFor(h.created_at).text} · ${why}`;
      });
      if (preview.holds.length > max) lines.push(`- ...and ${preview.holds.length - max} more`);
      return lines.join('\n');
    }

    // Secondary on purpose: the quiet outline button, not the red one every row
    // carries. Releasing a named hold is the normal path; this is housekeeping.
    // When nothing qualifies it says so instead of offering a dead button.
    function renderUnreportedControl() {
      const box = $('holds-bulk');
      if (!box) return;
      if (currentUser.role !== 'admin') { box.innerHTML = ''; return; }
      const wrap = (inner) => `<div style="background:white;padding:0 14px 12px;font-size:0.76rem;color:var(--ink-soft);border-bottom:1px solid var(--line);">${inner}</div>`;
      if (!unreportedPreview) {
        box.innerHTML = wrap('Could not check which holds are unreported — tap Refresh to try again.');
        return;
      }
      const p = unreportedPreview;
      if (!p.count) {
        box.innerHTML = wrap('Nothing to clean up — every hold is either a parked bill or a cart a till is still reporting.');
        return;
      }
      const holdWord = `hold${p.count === 1 ? '' : 's'}`;
      const cartWord = `cart${p.carts === 1 ? '' : 's'}`;
      box.innerHTML = wrap(
        `<button class="btn btn-outline btn-sm" id="holds-sweep" onclick="releaseUnreportedHolds(this)">Release ${p.count} unreported ${holdWord} (${p.carts} ${cartWord})</button>`
        + `<div style="margin-top:6px;">Cleanup tool: carts no till has reported for over ${p.threshold_minutes} minutes with no parked bill behind them — abandoned part-way through ringing up. Parked bills and carts a till is checking in for are never touched.</div>`
      );
    }

    // confirm() sits OUTSIDE withBusy, as everywhere else here: the guard exists
    // to stop a second tap while the POST is in flight, and a modal prompt inside
    // it would hold the button disabled for as long as the dialog stayed open.
    // The preview is re-fetched first so the dialog names what is true NOW rather
    // than what the label was built from minutes ago, and the ids from THAT fetch
    // are what gets posted. The list is not re-rendered before the confirm on
    // purpose — it would replace the very button withBusy is guarding.
    async function releaseUnreportedHolds(btn) {
      await loadUnreportedPreview();
      const p = unreportedPreview;
      if (!p) {
        toast('Could not check which holds are unreported. Please try again.', 'error');
        renderUnreportedControl();
        return;
      }
      if (!p.count) {
        toast('Nothing to release — every hold is reported by a till or owned by a parked bill.');
        renderUnreportedControl();
        return;
      }
      const ids = p.hold_ids.slice();
      const holdWord = `hold${p.count === 1 ? '' : 's'}`;
      const cartWord = `cart${p.carts === 1 ? '' : 's'}`;
      if (!confirm(`Release ${p.count} unreported ${holdWord} from ${p.carts} ${cartWord}?\n\n${unreportedLines(p, 8)}\n\nThat stock goes back on sale immediately. Parked bills, and carts a till is checking in for, are not touched.`)) return;

      await withBusy(btn, async () => {
        let res;
        try {
          res = await api('/api/pos/reservations/release-unreported', { method: 'POST', body: { hold_ids: ids } });
        } catch (err) {
          // 409: something in that set became legitimate between the preview and
          // this tap — a cart resumed, or a bill parked on it. The server
          // released NOTHING, so say what happened and reload the list.
          if (err && err.data && err.data.needs_refresh) {
            toast(err.message, 'error');
            load();
            return;
          }
          throw err;
        }
        const gone = res.already_gone ? ` ${res.already_gone} had already gone.` : '';
        toast(`Released ${res.released} hold${res.released === 1 ? '' : 's'} from ${res.carts} cart${res.carts === 1 ? '' : 's'}.${gone}`);
        load();
      }, 'Releasing…');
    }

    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e83e8c">
  <title>KUKI · Stock</title>
  <link rel="icon" href="/public/img/kuki_logo.png">
  <link rel="stylesheet" href="/public/css/mobile.css">
</head>
<body>
  <div class="topbar">
    <a href="/m" class="back">‹</a>
    <h1>Stock</h1>
    <a href="/stock?desktop=1" class="right">Desktop</a>
  </div>
  <div class="filters">
    <input type="text" id="s-search" placeholder="Search stock items…">
    <select id="s-cat"><option value="">All categories</option></select>
  </div>
  <div id="stock-list"><div class="empty">Loading…</div></div>

  <div id="tracked-section" style="display:none;">
    <div style="background:white;padding:12px 14px 4px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;border-top:8px solid var(--bg);">Tracked Products</div>
    <div style="padding:8px 14px;background:white;border-bottom:1px solid var(--line);">
      <select id="prod-cat-filter" onchange="renderTracked()" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:white;"><option value="">All product categories</option></select>
    </div>
    <div id="tracked-list"></div>
  </div>

  <!-- Held stock: what open carts are reserving right now -->
  <div id="holds-section">
    <div style="background:white;padding:12px 14px 4px;border-top:8px solid var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <span style="font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.1em;font-size:0.72rem;">Held Stock</span>
      <button class="btn btn-outline btn-sm" id="holds-refresh" style="width:auto;flex:0 0 auto;" onclick="refreshHolds(this)">Refresh</button>
    </div>
    <div id="holds-note" style="background:white;padding:2px 14px 10px;font-size:0.76rem;color:var(--ink-soft);border-bottom:1px solid var(--line);"></div>
    <div id="holds-list"></div>
  </div>

  <div class="sheet" id="restock-sheet" onclick="if(event.target===this)closeSheet('restock-sheet')">
    <div class="sheet-inner">
      <div class="sheet-handle"></div>
      <h3 id="restock-title">Add stock</h3>
      <input type="hidden" id="restock-id">
      <div class="field"><label>Current quantity</label><input type="text" id="restock-current" readonly></div>
      <div class="field"><label>Add (units)</label><input type="number" id="restock-add" min="1" step="1" inputmode="numeric"></div>
      <div class="field"><label>Note (optional)</label><input type="text" id="restock-note" placeholder="supplier, batch, etc."></div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet('restock-sheet')">Cancel</button>
        <button class="btn btn-success" onclick="submitRestock(this)">Add to stock</button>
      </div>
      <button class="btn btn-danger" style="margin-top:8px;" onclick="disposeFromSheet(this)">Dispose expired…</button>
    </div>
  </div>

  <button class="fab" id="fab" onclick="openAdd()" style="display:none;">+</button>

  <!-- Edit / adjust sheet -->
  <div class="sheet" id="stock-sheet" onclick="if(event.target===this)closeSheet('stock-sheet')">
    <div class="sheet-inner">
      <div class="sheet-handle"></div>
      <h3 id="sh-title">Stock item</h3>
      <input type="hidden" id="s-id">
      <div class="field"><label>Name</label><input type="text" id="s-name"></div>
      <div class="field"><label>Category</label><select id="s-cat-sel"></select></div>
      <div class="field"><label>Unit (kg, L, pcs)</label><input type="text" id="s-unit"></div>
      <div class="field"><label>Quantity on hand</label><input type="number" id="s-qty" min="0" step="0.001" inputmode="decimal"></div>
      <div class="field"><label>Cost per unit (Rs.)</label><input type="number" id="s-cost" min="0" step="0.01" inputmode="decimal"></div>
      <div class="field"><label>Reorder level</label><input type="number" id="s-reorder" min="0" step="0.001" inputmode="decimal"></div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet('stock-sheet')">Cancel</button>
        <button class="btn btn-primary" onclick="saveItem(this)">Save</button>
      </div>
      <hr style="margin:18px 0;border:none;border-top:1px solid var(--line);">
      <h3 style="font-size:0.95rem;">Quick stock movement</h3>
      <div class="field"><label>Quantity change (+ in, − out)</label><input type="number" id="tx-qty" step="0.001" placeholder="e.g., 5 or -2" inputmode="decimal"></div>
      <div class="field"><label>Type</label><select id="tx-type"><option value="purchase">Purchase / Stock-in</option><option value="adjustment">Adjustment</option><option value="waste">Waste</option></select></div>
      <div class="field"><label>Reference (optional)</label><input type="text" id="tx-ref" placeholder="e.g., supplier #123"></div>
      <button class="btn btn-success" onclick="addTx(this)">Record movement</button>
    </div>
  </div>

  <script src="/public/js/mobile.js"></script>
  <script>
    let items = [], cats = [], tracked = [], holds = [];

    // A hold has no expiry by design (the owner rejected auto-release), so a cart
    // killed by a closed tab or a flat battery strands its stock forever. Three
    // hours is the line: a cart only exists once the customer has confirmed the
    // order, and a confirmed order at this counter is paid within minutes, so
    // nothing live survives an afternoon. Highlight only — nothing is released
    // for you. Kept in step with the same constant in views/stock.html.
    const HOLD_STALE_HOURS = 3;

    async function load() {
      await bootMobile();
      if (currentUser.role !== 'admin') { $('fab').style.display = 'none'; toast('Read-only — admin needed to edit'); }
      else $('fab').style.display = 'block';
      const [stocks, allCats, prods, activeHolds] = await Promise.all([
        api('/api/stock/items'),
        api('/api/stock/categories'),
        api('/api/products'),
        api('/api/pos/reservations'),
      ]);
      items = stocks; cats = allCats; holds = activeHolds;
      tracked = prods.filter(p => p.is_active && p.track_stock);
      const catOpts = '<option value="">All categories</option>' + cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      $('s-cat').innerHTML = catOpts;
      $('s-cat-sel').innerHTML = cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      render();
      renderTracked();
      renderHolds();
      $('s-search').addEventListener('input', () => { render(); renderTracked(); });
      $('s-cat').addEventListener('change', render);
    }

    function renderTracked() {
      const sec = $('tracked-section');
      if (!tracked.length) { sec.style.display = 'none'; return; }
      // Populate the product-category select (preserves selection across re-renders)
      const filter = $('prod-cat-filter');
      const cats = sortCategoriesPOS([...new Set(tracked.map(p => p.category).filter(Boolean))]);
      const prev = filter.value;
      filter.innerHTML = '<option value="">All product categories</option>' +
        cats.map(c => `<option value="${c.replace(/"/g, '&quot;')}">${escapeHtml(c)}</option>`).join('');
      if (prev) filter.value = prev;
      const catFilter = filter.value;
      const q = $('s-search').value.toLowerCase().trim();
      const list = tracked.filter(p => {
        if (catFilter && (p.category || '').toLowerCase() !== catFilter.toLowerCase()) return false;
        if (q && !(p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q))) return false;
        return true;
      });
      sec.style.display = 'block';
      if (!list.length) { $('tracked-list').innerHTML = '<div class="empty">No matches</div>'; return; }
      $('tracked-list').innerHTML = list.map(p => {
        const out = p.stock_quantity <= 0;
        const low = !out && p.stock_reorder_level > 0 && p.stock_quantity <= p.stock_reorder_level;
        const status = out ? '<span class="badge danger">OUT</span>' : low ? '<span class="badge warning">LOW</span>' : '';
        return `<div class="list-item" onclick="openRestock(${p.id})">
          <div class="list-head">
            <span class="list-title">${escapeHtml(p.name)} ${status}</span>
            <span class="list-amount" style="color:${out ? 'var(--red)' : (low ? '#92400e' : 'var(--ink)')};">${p.stock_quantity}</span>
          </div>
          <div class="list-meta">${escapeHtml(p.category || '-')} · min ${p.stock_reorder_level} · tap to add stock</div>
        </div>`;
      }).join('');
    }

    function openRestock(id) {
      const p = tracked.find(x => x.id === id);
      if (!p) return;
      $('restock-title').textContent = p.name;
      $('restock-id').value = id;
      $('restock-current').value = p.stock_quantity;
      $('restock-add').value = '';
      $('restock-note').value = '';
      openSheet('restock-sheet');
    }

    async function submitRestock(btn) {
      const id = $('restock-id').value;
      const qty = parseFloat($('restock-add').value);
      if (!qty || qty <= 0) { toast('Enter a quantity', 'error'); return; }
      await withBusy(btn, async () => {
        await api(`/api/products/${id}/restock`, { method: 'POST', body: { quantity: qty, note: $('restock-note').value.trim() } });
        closeSheet('restock-sheet');
        toast(`Added ${qty} to stock`);
        load();
      }, 'Adding…');
    }

    async function disposeFromSheet(btn) {
      const id = $('restock-id').value;
      const p = tracked.find(x => x.id === parseInt(id));
      if (!p) return;
      const qtyStr = prompt(`Dispose how many units of "${p.name}"?`, '1');
      if (qtyStr === null) return;
      const qty = parseFloat(qtyStr);
      if (!qty || qty <= 0) { toast('Invalid quantity', 'error'); return; }
      const reason = prompt('Reason (e.g., expired, damaged)?', 'expired');
      if (reason === null) return;
      await withBusy(btn, async () => {
        const r = await api(`/api/products/${id}/dispose`, { method: 'POST', body: { quantity: qty, reason } });
        closeSheet('restock-sheet');
        toast(`Disposed ${qty} — loss ${fmt(r.cost_loss)}`);
        load();
      }, 'Disposing…');
    }

    function render() {
      const q = $('s-search').value.toLowerCase().trim();
      const catId = $('s-cat').value;
      const filtered = items.filter(it => {
        if (q && !it.name.toLowerCase().includes(q)) return false;
        if (catId && String(it.category_id) !== catId) return false;
        return true;
      });
      if (!filtered.length) { $('stock-list').innerHTML = '<div class="empty">No items</div>'; return; }
      const isAdmin = currentUser.role === 'admin';
      $('stock-list').innerHTML = filtered.map(it => {
        const low = it.reorder_level > 0 && it.quantity <= it.reorder_level;
        return `<div class="list-item" ${isAdmin ? `onclick="editItem(${it.id})"` : ''}>
          <div class="list-head">
            <span class="list-title">${escapeHtml(it.name)}${low ? ' <span class="badge danger">LOW</span>' : ''}</span>
            <span class="list-amount" style="color:${low ? 'var(--red)' : 'var(--ink)'};">${it.quantity} ${escapeHtml(it.unit || '')}</span>
          </div>
          <div class="list-meta">${escapeHtml(it.category_name || '-')} · cost ${fmt(it.cost_per_unit)} / ${escapeHtml(it.unit || 'u')} · min ${it.reorder_level}</div>
        </div>`;
      }).join('');
    }

    function openAdd() {
      $('sh-title').textContent = 'New stock item';
      $('s-id').value = '';
      ['s-name', 's-unit', 's-qty', 's-cost', 's-reorder', 'tx-qty', 'tx-ref'].forEach(id => $(id).value = '');
      if (cats[0]) $('s-cat-sel').value = cats[0].id;
      openSheet('stock-sheet');
    }
    function editItem(id) {
      const it = items.find(x => x.id === id);
      $('sh-title').textContent = 'Edit · ' + it.name;
      $('s-id').value = it.id;
      $('s-name').value = it.name;
      $('s-cat-sel').value = it.category_id || (cats[0] && cats[0].id);
      $('s-unit').value = it.unit || '';
      $('s-qty').value = it.quantity;
      $('s-cost').value = it.cost_per_unit || 0;
      $('s-reorder').value = it.reorder_level || 0;
      ['tx-qty', 'tx-ref'].forEach(id => $(id).value = '');
      openSheet('stock-sheet');
    }
    async function saveItem(btn) {
      const id = $('s-id').value;
      const body = {
        name: $('s-name').value.trim(),
        category_id: parseInt($('s-cat-sel').value) || null,
        unit: $('s-unit').value.trim(),
        quantity: parseFloat($('s-qty').value) || 0,
        cost_per_unit: parseFloat($('s-cost').value) || 0,
        reorder_level: parseFloat($('s-reorder').value) || 0,
      };
      if (!body.name) { toast('Name required', 'error'); return; }
      await withBusy(btn, async () => {
        if (id) await api(`/api/stock/items/${id}`, { method: 'PUT', body });
        else await api('/api/stock/items', { method: 'POST', body });
        closeSheet('stock-sheet');
        toast('Saved');
        items = await api('/api/stock/items');
        render();
      }, 'Saving…');
    }
    // This sheet deliberately stays open after a movement so several movements can
    // be entered in a row, so the busy guard below is the ONLY thing stopping a
    // repeat tap from moving the stock twice. On success we also clear the inputs
    // immediately, so a tap after the guard releases hits the "enter a quantity"
    // check instead of re-sending the same movement.
    async function addTx(btn) {
      const id = $('s-id').value;
      if (!id) { toast('Save the item first', 'error'); return; }
      const qty = parseFloat($('tx-qty').value);
      if (!qty) { toast('Enter a quantity change', 'error'); return; }
      const type = $('tx-type').value;
      const reference = $('tx-ref').value.trim() || null;
      await withBusy(btn, async () => {
        await api(`/api/stock/items/${id}/transaction`, { method: 'POST', body: { type, quantity: qty, reference } });
        $('tx-qty').value = '';
        $('tx-ref').value = '';
        items = await api('/api/stock/items');
        const it = items.find(x => x.id === parseInt(id));
        if (it) { $('s-qty').value = it.quantity; }
        toast(`Recorded ${qty > 0 ? '+' : ''}${qty}${it ? ` — on hand ${it.quantity}` : ''}`);
        render();
      }, 'Recording…');
    }

    // ===== Held stock (cart reservations) =====
    // Listing holds is open to any logged-in user; releasing someone else's hold
    // is adminOnly on the server, so the Release button is rendered for admins
    // only — this page already runs read-only for a cashier, and a button that
    // can only ever return 403 is worse than a line of text saying who can.

    // Relative age, e.g. "2h 14m". parseDbDate() (mobile.js) tags the SQLite
    // timestamp as UTC first; subtracting a raw string would read 5h30m out in
    // Colombo and hide every stale hold.
    function heldFor(created_at) {
      const dt = parseDbDate(created_at);
      if (!dt) return { text: 'unknown', hours: 0 };
      const mins = Math.max(0, Math.floor((Date.now() - dt.getTime()) / 60000));
      const h = Math.floor(mins / 60);
      return { text: h > 0 ? `${h}h ${mins % 60}m` : `${mins}m`, hours: mins / 60 };
    }

    function renderHolds() {
      const note = $('holds-note');
      const list = $('holds-list');
      const isAdmin = currentUser.role === 'admin';

      if (!holds.length) {
        note.textContent = '';
        list.innerHTML = '<div class="empty">No stock is currently held — every tracked item is free to sell.</div>';
        return;
      }

      const stale = holds.filter(h => heldFor(h.created_at).hours >= HOLD_STALE_HOURS).length;
      note.innerHTML = stale
        ? `<b style="color:var(--red);">${stale} hold${stale === 1 ? '' : 's'} older than ${HOLD_STALE_HOURS}h.</b> A live cart is paid within minutes, so these were probably stranded by a closed tab or a flat tablet. Releasing one puts its stock back on sale.`
        : `${holds.length} live hold${holds.length === 1 ? '' : 's'}. Nothing older than ${HOLD_STALE_HOURS}h.`;

      list.innerHTML = holds.map(h => {
        const age = heldFor(h.created_at);
        const isStale = age.hours >= HOLD_STALE_HOURS;
        const name = escapeHtml(h.product_name || `Product #${h.product_id}`);
        return `<div class="list-item"${isStale ? ' style="background:#fff5f5;"' : ''}>
          <div class="list-head">
            <span class="list-title">${name}${isStale ? ' <span class="badge danger">Stale</span>' : ''}</span>
            <span class="list-amount">${h.quantity}</span>
          </div>
          <div class="list-meta" style="word-break:break-all;">cart ${escapeHtml(h.cart_id || '-')} · ${escapeHtml(h.cashier_name || '-')}</div>
          <div class="list-meta"${isStale ? ' style="color:var(--red);font-weight:600;"' : ''}>held ${escapeHtml(age.text)} · ${escapeHtml(formatDateTime(h.created_at))}</div>
          ${isAdmin
            ? `<button class="btn btn-danger btn-sm" style="margin-top:8px;" onclick="releaseStockHold(${h.id}, this)">Release</button>`
            : '<div class="list-meta">Admin needed to release</div>'}
        </div>`;
      }).join('');
    }

    async function refreshHolds(btn) {
      await withBusy(btn, async () => {
        holds = await api('/api/pos/reservations');
        renderHolds();
      }, 'Refreshing…');
    }

    // confirm() sits OUTSIDE withBusy on purpose: the guard exists to stop a
    // second tap while the DELETE is in flight, and a modal prompt inside it
    // would hold the button disabled for as long as the dialog stayed open.
    async function releaseStockHold(id, btn) {
      const h = holds.find(x => x.id === id);
      if (!h) return;
      const name = h.product_name || `product #${h.product_id}`;
      if (!confirm(`Release the hold on ${h.quantity} x "${name}" from cart ${h.cart_id}?\n\nThe stock goes back on sale immediately. If that cart is still live at another till, its sale will fail.`)) return;
      await withBusy(btn, async () => {
        await api(`/api/pos/reservations/${id}`, { method: 'DELETE' });
        toast(`Released ${h.quantity} x ${name}`);
        load();
      }, 'Releasing…');
    }

    load();
  </script>
</body>
</html>

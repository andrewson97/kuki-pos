<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar"><h5 class="mb-0">Other Income</h5><div id="top-bar-user"></div></div>
    <div class="content-area">
      <div class="d-flex justify-content-between mb-3">
        <div class="d-flex gap-2">
          <input type="date" class="form-control" id="inc-start" style="width:160px;">
          <input type="date" class="form-control" id="inc-end" style="width:160px;">
          <button class="btn btn-outline-secondary" onclick="loadIncome()">Filter</button>
        </div>
        <button class="btn btn-primary" onclick="showAddIncome()">+ Add Income</button>
      </div>
      <div class="row mb-3">
        <div class="col-md-3">
          <div class="stat-card"><div class="stat-label">Total (filtered)</div><div class="stat-value" id="inc-total">-</div></div>
        </div>
      </div>
      <div class="table-container">
        <table class="table table-hover mb-0">
          <thead><tr><th>Date</th><th>Source</th><th>Amount</th><th>Description</th><th>By</th><th>Actions</th></tr></thead>
          <tbody id="income-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="incomeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Add Income</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Source</label><input type="text" class="form-control" id="inc-source" placeholder="e.g., Catering, Refund"></div>
          <div class="mb-3"><label class="form-label">Amount</label><input type="number" class="form-control" id="inc-amount" step="0.01" min="0"></div>
          <div class="mb-3"><label class="form-label">Description</label><input type="text" class="form-control" id="inc-desc"></div>
          <div class="mb-3"><label class="form-label">Date</label><input type="date" class="form-control" id="inc-date"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" onclick="saveIncome()">Save</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    initApp('/income', () => {
      const today = todayISO();
      document.getElementById('inc-start').value = today.substring(0, 8) + '01';
      document.getElementById('inc-end').value = today;
      document.getElementById('inc-date').value = today;
      loadIncome();
    });

    async function loadIncome() {
      const params = new URLSearchParams();
      const s = document.getElementById('inc-start').value;
      const e = document.getElementById('inc-end').value;
      if (s) params.set('start_date', s);
      if (e) params.set('end_date', e);
      const items = await api(`/api/income?${params}`);
      const total = items.reduce((s, i) => s + i.amount, 0);
      document.getElementById('inc-total').textContent = formatCurrency(total);
      document.getElementById('income-table').innerHTML = items.map(i => `
        <tr>
          <td>${formatDate(i.income_date)}</td>
          <td class="fw-bold">${i.source}</td>
          <td class="fw-bold text-success">${formatCurrency(i.amount)}</td>
          <td>${i.description || '-'}</td>
          <td>${i.user_name || '-'}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="deleteIncome(${i.id})">Delete</button></td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="text-center text-muted py-4">No income records</td></tr>';
    }

    function showAddIncome() {
      document.getElementById('inc-source').value = '';
      document.getElementById('inc-amount').value = '';
      document.getElementById('inc-desc').value = '';
      document.getElementById('inc-date').value = todayISO();
      new bootstrap.Modal(document.getElementById('incomeModal')).show();
    }

    async function saveIncome() {
      await api('/api/income', {
        method: 'POST',
        body: {
          source: document.getElementById('inc-source').value,
          amount: parseFloat(document.getElementById('inc-amount').value),
          description: document.getElementById('inc-desc').value,
          income_date: document.getElementById('inc-date').value,
        },
      });
      bootstrap.Modal.getInstance(document.getElementById('incomeModal')).hide();
      showToast('Income recorded!');
      loadIncome();
    }

    async function deleteIncome(id) {
      if (!confirm('Delete this income record?')) return;
      await api(`/api/income/${id}`, { method: 'DELETE' });
      showToast('Income deleted');
      loadIncome();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Cake Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <div class="d-flex align-items-center gap-3">
        <h5 class="mb-0">Point of Sale</h5>
        <span class="badge bg-dark fs-6" id="token-badge">Token #---</span>
      </div>
      <div id="top-bar-user"></div>
    </div>
    <div id="shift-banner" style="display:none;"></div>
    <div class="pos-container" style="padding:15px;">
      <!-- Products panel -->
      <div style="overflow-y:auto;">
        <div class="mb-2">
          <input type="text" class="form-control" id="product-search" placeholder="Search products...">
        </div>
        <div class="category-tabs mb-3" id="category-tabs"></div>
        <div id="product-grid"></div>
      </div>
      <!-- Cart panel -->
      <div class="cart-panel">
        <div class="cart-header">
          <span>Cart <span class="badge bg-secondary" id="cart-count">0</span></span>
          <button class="btn btn-sm btn-outline-danger" onclick="clearCart()">Clear</button>
        </div>
        <div class="cart-items" id="cart-items">
          <div class="text-center text-muted py-5" id="cart-empty">No items in cart</div>
        </div>
        <div class="cart-summary">
          <div class="summary-row" id="row-savings" style="display:none;color:#dc3545;"><span>Item Discounts</span><span id="cart-savings">-</span></div>
          <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">-</span></div>
          <div class="summary-row">
            <span>Extra Discount</span>
            <div class="d-flex align-items-center gap-1">
              <input type="number" class="form-control form-control-sm" id="discount-input" value="0" min="0" style="width:80px;text-align:right;" oninput="updateCartTotals()">
            </div>
          </div>
          <div class="summary-row"><span>Tax (<span id="tax-rate-display">0</span>%)</span><span id="cart-tax">-</span></div>
          <div class="summary-row total-row"><span>TOTAL</span><span id="cart-total">-</span></div>
        </div>
        <div style="padding:10px 20px;">
          <div class="mb-2 position-relative">
            <input type="text" class="form-control form-control-sm" id="customer-search" placeholder="Search customer (name/phone)..." autocomplete="off">
            <input type="hidden" id="customer-id" value="">
            <div id="customer-dropdown" class="position-absolute w-100 bg-white border rounded shadow-sm" style="display:none;z-index:999;max-height:200px;overflow-y:auto;top:100%;"></div>
            <div id="customer-selected" class="d-flex align-items-center justify-content-between mt-1" style="display:none!important;">
              <small class="text-success fw-bold" id="customer-selected-name"></small>
              <button class="btn btn-sm btn-outline-secondary" onclick="clearCustomer()" style="padding:0 6px;font-size:0.7rem;">x</button>
            </div>
          </div>
          <div class="d-flex gap-2 mb-2">
            <button class="btn btn-sm flex-fill" id="pay-cash" onclick="openCashModal()" style="background:#28a745;color:white;">Cash</button>
            <button class="btn btn-sm flex-fill" id="pay-card" onclick="checkout('card')" style="background:#007bff;color:white;">Card</button>
            <button class="btn btn-sm flex-fill" id="pay-upi" onclick="checkout('upi')" style="background:#6f42c1;color:white;">UPI</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cash Payment Modal -->
  <div class="modal fade" id="cashModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Cash Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between mb-2"><span>Total:</span><strong id="cash-total"></strong></div>
          <label class="form-label fw-bold">Amount Given</label>
          <input type="number" class="form-control form-control-lg" id="cash-given" step="0.01" min="0" autofocus>
          <div class="d-flex flex-wrap gap-1 mt-2" id="quick-cash"></div>
          <hr>
          <div class="d-flex justify-content-between fs-5"><span>Change:</span><strong id="cash-change" class="text-success">Rs. 0.00</strong></div>
          <div id="cash-warning" class="text-danger small mt-1" style="display:none;">Insufficient amount</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-success" id="cash-confirm">Confirm Sale</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div class="modal fade" id="receiptModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Bill Created</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-3">
            <img src="/public/img/kuki_logo.png" alt="KUKI" style="max-width:140px;max-height:100px;display:block;margin:0 auto 8px;">
            <span class="badge bg-success fs-5" id="receipt-token">Token #001</span>
            <div class="mt-2 fs-4 fw-bold" id="receipt-total"></div>
          </div>
          <div class="receipt-preview" id="receipt-text"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" onclick="printReceiptText()">Print Receipt</button>
          <button class="btn btn-primary" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <script>
    let products = [];
    let cart = [];
    let taxRate = 0;
    let customers = [];
    let lastReceiptText = '';
    let lastKitchenText = '';
    let activeCategory = '';
    let shiftBlocked = false;
    let shiftBlockReason = '';

    initApp('/pos', loadPOS);

    async function loadPOS() {
      taxRate = parseFloat(appSettings.tax_rate || '0');
      document.getElementById('tax-rate-display').textContent = taxRate;

      const [prods, token, custs] = await Promise.all([
        api('/api/products/active'),
        api('/api/pos/token'),
        api('/api/customers'),
      ]);
      products = prods;
      customers = custs;
      document.getElementById('token-badge').textContent = `Token #${String(token.next_token).padStart(3,'0')}`;

      renderCategoryTabs();
      renderProducts();
      setupCustomerSearch();
      await checkShiftState();

      document.getElementById('product-search').addEventListener('input', renderProducts);
    }

    async function checkShiftState() {
      const enforce = (appSettings.enforce_cash_shift ?? '1') === '1';
      if (!enforce) { shiftBlocked = false; updateShiftUI(); return; }
      try {
        const data = await api('/api/cash/today');
        if (!data.shift_open) {
          shiftBlocked = true;
          shiftBlockReason = data.open
            ? 'Cash shift is closed. <a href="/cash" class="alert-link">Open a new shift</a> to continue billing.'
            : 'Cash drawer not opened today. <a href="/cash" class="alert-link">Open the drawer</a> before taking sales.';
        } else {
          shiftBlocked = false;
        }
      } catch {
        shiftBlocked = false; // network error — let server enforce
      }
      updateShiftUI();
    }

    function updateShiftUI() {
      const banner = document.getElementById('shift-banner');
      const cashBtn = document.getElementById('pay-cash');
      const cardBtn = document.getElementById('pay-card');
      const upiBtn = document.getElementById('pay-upi');
      if (shiftBlocked) {
        banner.innerHTML = `<div class="alert alert-warning mb-0 rounded-0">&#9888;&#65039; ${shiftBlockReason}</div>`;
        banner.style.display = 'block';
        [cashBtn, cardBtn, upiBtn].forEach(b => { if (b) { b.disabled = true; b.style.opacity = '0.5'; b.style.cursor = 'not-allowed'; } });
      } else {
        banner.style.display = 'none';
        [cashBtn, cardBtn, upiBtn].forEach(b => { if (b) { b.disabled = false; b.style.opacity = ''; b.style.cursor = ''; } });
      }
    }

    function renderCategoryTabs() {
      const counts = {};
      products.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
      const cats = Object.keys(counts).sort();
      const pills = [{ key: '', label: 'All', count: products.length }, ...cats.map(c => ({ key: c, label: c, count: counts[c] }))];
      document.getElementById('category-tabs').innerHTML = pills.map(p => `
        <button type="button" class="cat-pill ${activeCategory === p.key ? 'active' : ''}" onclick="selectCategory('${p.key.replace(/'/g, "\\'")}')">${p.label} <span class="cat-count">${p.count}</span></button>
      `).join('');
    }

    function selectCategory(key) {
      activeCategory = key;
      renderCategoryTabs();
      renderProducts();
    }

    // Customer search
    function setupCustomerSearch() {
      const input = document.getElementById('customer-search');
      const dropdown = document.getElementById('customer-dropdown');

      input.addEventListener('input', () => {
        const q = input.value.toLowerCase().trim();
        if (q.length === 0) { dropdown.style.display = 'none'; return; }
        const matches = customers.filter(c =>
          c.name.toLowerCase().includes(q) || (c.phone || '').includes(q)
        ).slice(0, 10);
        if (matches.length === 0) {
          dropdown.innerHTML = '<div class="p-2 text-muted" style="font-size:0.85rem;">No customers found</div>';
        } else {
          dropdown.innerHTML = matches.map(c => `
            <div class="p-2 border-bottom" style="cursor:pointer;font-size:0.85rem;" onmousedown="selectCustomer(${c.id}, '${c.name.replace(/'/g, "\\'")}')">
              <strong>${c.name}</strong>${c.phone ? ' <span class="text-muted">(' + c.phone + ')</span>' : ''}
            </div>
          `).join('');
        }
        dropdown.style.display = 'block';
      });

      input.addEventListener('blur', () => {
        setTimeout(() => { dropdown.style.display = 'none'; }, 150);
      });
      input.addEventListener('focus', () => {
        if (input.value.trim().length > 0) input.dispatchEvent(new Event('input'));
      });
    }

    function selectCustomer(id, name) {
      document.getElementById('customer-id').value = id;
      document.getElementById('customer-search').value = '';
      document.getElementById('customer-dropdown').style.display = 'none';
      const selectedEl = document.getElementById('customer-selected');
      selectedEl.style.cssText = 'display:flex!important;';
      document.getElementById('customer-selected-name').textContent = name;
    }

    function clearCustomer() {
      document.getElementById('customer-id').value = '';
      document.getElementById('customer-search').value = '';
      document.getElementById('customer-selected').style.cssText = 'display:none!important;';
    }

    function renderProducts() {
      const search = document.getElementById('product-search').value.toLowerCase();
      const filtered = products.filter(p => {
        if (search && !p.name.toLowerCase().includes(search)) return false;
        if (activeCategory && p.category !== activeCategory) return false;
        return true;
      });

      const card = (p) => {
        const effective = p.discount_price || p.selling_price;
        const priceHtml = p.discount_price
          ? `<div class="product-price"><s class="text-muted" style="font-size:0.8rem">${formatCurrency(p.selling_price)}</s> <span class="text-danger">${formatCurrency(effective)}</span></div>`
          : `<div class="product-price">${formatCurrency(p.selling_price)}</div>`;
        const imgHtml = p.image_path
          ? `<div class="product-image" style="background-image:url('/uploads/${p.image_path}')"></div>`
          : `<div class="product-image product-image-placeholder">&#127874;</div>`;
        return `
        <div class="product-card" onclick="addToCart(${p.id})">
          ${imgHtml}
          <div class="product-name">${p.name}</div>
          ${priceHtml}
        </div>`;
      };

      const container = document.getElementById('product-grid');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-5 w-100">No products found</div>';
        return;
      }

      // When viewing All (no specific category selected), group with headers.
      // When a category is selected or user is searching, flat grid.
      if (activeCategory || search) {
        container.innerHTML = `<div class="product-grid">${filtered.map(card).join('')}</div>`;
      } else {
        const groups = {};
        filtered.forEach(p => { (groups[p.category] = groups[p.category] || []).push(p); });
        container.innerHTML = `<div class="cat-sections">${Object.keys(groups).sort().map(cat => `
          <div class="cat-section">
            <h6 class="cat-section-title">${cat} <small class="text-muted">(${groups[cat].length})</small></h6>
            <div class="product-grid">${groups[cat].map(card).join('')}</div>
          </div>
        `).join('')}</div>`;
      }
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      const existing = cart.find(c => c.product_id === productId);
      if (existing) {
        existing.quantity++;
      } else {
        const effective = product.discount_price || product.selling_price;
        cart.push({
          product_id: product.id,
          product_name: product.name,
          quantity: 1,
          unit_price: effective,
          original_price: product.selling_price,
        });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const emptyEl = document.getElementById('cart-empty');
      document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.quantity, 0);

      if (cart.length === 0) {
        container.innerHTML = '';
        emptyEl.style.display = 'block';
        container.appendChild(emptyEl);
      } else {
        container.innerHTML = cart.map((item, idx) => {
          const hasDiscount = item.original_price && item.original_price > item.unit_price;
          return `
          <div class="cart-item">
            <div>
              <div class="item-name">${item.product_name}</div>
              <div class="text-muted" style="font-size:0.8rem">
                ${hasDiscount ? `<s>${formatCurrency(item.original_price)}</s> <span class="text-danger">${formatCurrency(item.unit_price)}</span> each` : `${formatCurrency(item.unit_price)} each`}
              </div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <div class="item-qty">
                <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                <span class="fw-bold">${item.quantity}</span>
                <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
              </div>
              <span class="fw-bold" style="min-width:70px;text-align:right">${formatCurrency(item.quantity * item.unit_price)}</span>
              <button class="btn btn-sm text-danger" onclick="removeItem(${idx})" style="padding:2px 6px;">&times;</button>
            </div>
          </div>`;
        }).join('');
      }
      updateCartTotals();
    }

    function changeQty(idx, delta) {
      cart[idx].quantity += delta;
      if (cart[idx].quantity <= 0) cart.splice(idx, 1);
      renderCart();
    }

    function removeItem(idx) {
      cart.splice(idx, 1);
      renderCart();
    }

    function clearCart() {
      cart = [];
      document.getElementById('discount-input').value = 0;
      document.getElementById('cart-count').textContent = '0';
      document.getElementById('cart-subtotal').textContent = formatCurrency(0);
      document.getElementById('cart-tax').textContent = formatCurrency(0);
      document.getElementById('cart-total').textContent = formatCurrency(0);
      document.getElementById('cart-savings').textContent = '-' + formatCurrency(0);
      document.getElementById('row-savings').style.display = 'none';
      clearCustomer();
      renderCart();
    }

    function updateCartTotals() {
      const subtotal = cart.reduce((s, i) => s + i.quantity * i.unit_price, 0);
      const savings = cart.reduce((s, i) => s + (i.original_price && i.original_price > i.unit_price ? (i.original_price - i.unit_price) * i.quantity : 0), 0);
      const discount = parseFloat(document.getElementById('discount-input').value) || 0;
      const taxable = Math.max(0, subtotal - discount);
      const tax = taxable * (taxRate / 100);
      const total = taxable + tax;

      document.getElementById('row-savings').style.display = savings > 0 ? 'flex' : 'none';
      document.getElementById('cart-savings').textContent = '-' + formatCurrency(savings);
      document.getElementById('cart-subtotal').textContent = formatCurrency(subtotal);
      document.getElementById('cart-tax').textContent = formatCurrency(tax);
      document.getElementById('cart-total').textContent = formatCurrency(total);
    }

    function getCartTotal() {
      const subtotal = cart.reduce((s, i) => s + i.quantity * i.unit_price, 0);
      const discount = parseFloat(document.getElementById('discount-input').value) || 0;
      const taxable = Math.max(0, subtotal - discount);
      const tax = taxable * (taxRate / 100);
      return taxable + tax;
    }

    function openCashModal() {
      if (cart.length === 0) { showToast('Cart is empty', 'warning'); return; }
      if (shiftBlocked) { showToast(shiftBlockReason.replace(/<[^>]+>/g, ''), 'error'); return; }
      const total = getCartTotal();
      document.getElementById('cash-total').textContent = formatCurrency(total);
      const given = document.getElementById('cash-given');
      given.value = '';
      document.getElementById('cash-change').textContent = formatCurrency(0);
      document.getElementById('cash-warning').style.display = 'none';

      // Quick cash buttons (round-up presets)
      const presets = [];
      const rounded100 = Math.ceil(total / 100) * 100;
      const rounded500 = Math.ceil(total / 500) * 500;
      const rounded1000 = Math.ceil(total / 1000) * 1000;
      [Math.ceil(total), rounded100, rounded500, rounded1000, rounded1000 + 1000].forEach(v => {
        if (v >= total && !presets.includes(v)) presets.push(v);
      });
      document.getElementById('quick-cash').innerHTML = presets.slice(0, 5).map(v =>
        `<button type="button" class="btn btn-outline-secondary btn-sm" onclick="setCashGiven(${v})">${formatCurrency(v)}</button>`
      ).join('');

      given.oninput = () => {
        const amt = parseFloat(given.value) || 0;
        const change = amt - total;
        document.getElementById('cash-change').textContent = formatCurrency(Math.max(0, change));
        document.getElementById('cash-warning').style.display = (amt > 0 && amt < total) ? 'block' : 'none';
        document.getElementById('cash-confirm').disabled = amt < total;
      };
      document.getElementById('cash-confirm').disabled = true;
      document.getElementById('cash-confirm').onclick = () => {
        const amt = parseFloat(given.value) || 0;
        if (amt < total) return;
        bootstrap.Modal.getInstance(document.getElementById('cashModal')).hide();
        checkout('cash', amt);
      };

      new bootstrap.Modal(document.getElementById('cashModal')).show();
      setTimeout(() => given.focus(), 250);
    }

    function setCashGiven(v) {
      const input = document.getElementById('cash-given');
      input.value = v;
      input.dispatchEvent(new Event('input'));
    }

    async function checkout(paymentMethod, amountGiven) {
      if (cart.length === 0) { showToast('Cart is empty', 'warning'); return; }
      if (shiftBlocked) { showToast(shiftBlockReason.replace(/<[^>]+>/g, ''), 'error'); return; }

      const discount = parseFloat(document.getElementById('discount-input').value) || 0;
      const customerId = document.getElementById('customer-id').value || null;

      let result;
      try {
        result = await api('/api/pos/bill', {
          method: 'POST',
          body: {
            items: cart.map(i => ({
              product_id: i.product_id,
              product_name: i.product_name,
              quantity: i.quantity,
              unit_price: i.unit_price,
              original_price: i.original_price || i.unit_price,
            })),
            customer_id: customerId ? parseInt(customerId) : null,
            discount,
            tax_rate: taxRate,
            payment_method: paymentMethod,
            amount_given: paymentMethod === 'cash' && amountGiven ? amountGiven : null,
          },
        });
      } catch (err) {
        showToast('Failed to create bill: ' + err.message, 'error');
        return;
      }

      // Bill created successfully — everything below is non-critical
      // Show receipt
      document.getElementById('receipt-token').textContent = `Token #${String(result.token_number).padStart(3,'0')}`;
      document.getElementById('receipt-total').textContent = formatCurrency(result.total);
      document.getElementById('receipt-text').textContent = result.receipt_text;
      lastReceiptText = result.receipt_text;
      lastKitchenText = result.kitchen_text || '';
      new bootstrap.Modal(document.getElementById('receiptModal')).show();
      showToast('Bill created successfully!');

      // Reset cart and refresh token
      clearCart();
      try {
        const token = await api('/api/pos/token');
        document.getElementById('token-badge').textContent = `Token #${String(token.next_token).padStart(3,'0')}`;
      } catch {}
    }

    function printReceiptText() {
      const printWindow = window.open('', '_blank', 'width=350,height=700');
      const logoUrl = window.location.origin + '/public/img/kuki_logo.png';
      const slip = (text) => `
        <div class="slip">
          <img src="${logoUrl}" alt="KUKI">
          <pre>${text}</pre>
        </div>`;
      printWindow.document.write(`
        <html><head><title></title><style>
          @page { size: 58mm auto; margin: 0; }
          html, body { margin: 0; padding: 0; width: 58mm; }
          body { font-family: monospace; }
          .slip { padding: 3mm 2mm; width: 58mm; box-sizing: border-box; text-align: center; }
          .slip img { display: block; margin: 0 auto 3px; max-width: 40mm; max-height: 20mm; }
          .slip pre { font-family: monospace; font-size: 10px; margin: 0; white-space: pre-wrap; text-align: left; }
          .slip + .slip { page-break-before: always; }
          @media screen { body { background:#eee; } .slip { background:#fff; margin: 8px auto; box-shadow: 0 0 4px rgba(0,0,0,.2); } }
        </style></head><body>
          ${lastKitchenText ? slip(lastKitchenText) : ''}
          ${slip(lastReceiptText)}
          <script>
            window.addEventListener('load', () => {
              const imgs = Array.from(document.images);
              Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })))
                .then(() => { window.print(); setTimeout(() => window.close(), 500); });
            });
          <\/script>
        </body></html>
      `);
      printWindow.document.close();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F2') { e.preventDefault(); document.getElementById('product-search').focus(); }
      if (e.key === 'F9') { e.preventDefault(); openCashModal(); }
      if (e.key === 'F10') { e.preventDefault(); checkout('card'); }
      if (e.key === 'F11') { e.preventDefault(); checkout('upi'); }
      if (e.key === 'Escape') { clearCart(); }
    });
  </script>
</body>
</html>

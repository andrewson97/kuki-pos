<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bills - Cake Shop POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/public/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="top-bar">
      <h5 class="mb-0">Bill History</h5>
      <div id="top-bar-user"></div>
    </div>
    <div class="content-area">
      <div class="d-flex gap-3 mb-3">
        <input type="date" class="form-control" id="bill-date" style="width:180px;">
        <input type="text" class="form-control" id="bill-search" placeholder="Search token/customer..." style="width:250px;">
        <button class="btn btn-primary" onclick="loadBills()">Search</button>
      </div>
      <div class="table-container">
        <table class="table table-hover mb-0">
          <thead><tr>
            <th>Token</th><th>Date</th><th>Time</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Cashier</th><th>Actions</th>
          </tr></thead>
          <tbody id="bills-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bill Detail Modal -->
  <div class="modal fade" id="billDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bill-detail-title">Bill Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="bill-detail-body"></div>
        <div class="modal-footer">
          <button class="btn btn-outline-warning" id="btn-print-kitchen">Print Kitchen Copy</button>
          <button class="btn btn-outline-secondary" id="btn-print-customer">Print Customer Copy</button>
          <button class="btn btn-danger d-none" id="btn-refund-bill">Refund Bill</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/app.js"></script>
  <!-- Only for the admin-approval pieces a cashier's refund uses (askAdmin, wireRefundDecision). -->
  <script src="/public/js/closing.js"></script>
  <script>
    initApp('/bills', () => {
      document.getElementById('bill-date').value = todayISO();
      loadBills();
    });

    // The stored value stays 'upi' (the database CHECK allows only cash/card/upi);
    // in Sri Lanka the QR payment is LankaQR, so that is what the screen says.
    function payLabel(m) {
      return ({ cash: 'Cash', card: 'Card', upi: 'LankaQR' })[m] || (m || '-');
    }

    // NULL on bills from before the till asked — shown as nothing, never guessed.
    function orderTypeLabel(t) {
      return ({ takeaway: 'Takeaway', dine_in: 'Dine in' })[t] || '';
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    const isAdmin = () => !!(currentUser && currentUser.role === 'admin');

    // A bill made by collecting a pre-order never took anything out of stock,
    // so its refund can never put anything back (the server ignores the choice
    // for these too).
    function isPreorderBill(bill) {
      return String(bill.cart_id || '').startsWith('preorder-');
    }

    async function loadBills() {
      const date = document.getElementById('bill-date').value;
      const search = document.getElementById('bill-search').value;
      const params = new URLSearchParams();
      if (date) params.set('date', date);
      if (search) params.set('search', search);

      const bills = await api(`/api/pos/bills?${params}`);
      document.getElementById('bills-table').innerHTML = bills.map(b => `
        <tr>
          <td><strong>#${String(b.token_number).padStart(3,'0')}</strong></td>
          <td>${formatDate(b.bill_date)}</td>
          <td>${formatTime(b.created_at)}</td>
          <td>${esc(b.customer_name || '-')}</td>
          <td>-</td>
          <td class="fw-bold">${formatCurrency(b.total)}</td>
          <td><span class="badge bg-info">${payLabel(b.payment_method)}</span>${orderTypeLabel(b.order_type) ? ` <span class="badge bg-light text-dark border">${orderTypeLabel(b.order_type)}</span>` : ''}</td>
          <td><span class="badge bg-${b.status === 'completed' ? 'success' : (b.status === 'refunded' ? 'warning text-dark' : 'danger')}">${b.status}</span>${b.refund_pending ? ' <span class="badge bg-warning text-dark" title="A refund is waiting for an admin">refund asked</span>' : ''}</td>
          <td>${esc(b.cashier_name || '-')}</td>
          <td><button class="btn btn-sm btn-outline-primary" onclick="viewBill(${b.id})">View</button></td>
        </tr>
      `).join('') || '<tr><td colspan="10" class="text-center text-muted py-4">No bills found</td></tr>';
    }

    async function viewBill(id) {
      const bill = await api(`/api/pos/bills/${id}`);
      document.getElementById('bill-detail-title').textContent = `Bill #${String(bill.token_number).padStart(3,'0')}`;
      document.getElementById('bill-detail-body').innerHTML = `
        <div class="row mb-3">
          <div class="col-md-6">
            <p><strong>Date:</strong> ${formatDate(bill.bill_date)}<br>
            <strong>Time:</strong> ${formatDateTime(bill.created_at)}<br>
            <strong>Customer:</strong> ${esc(bill.customer_name || 'Walk-in')}<br>
            <strong>Payment:</strong> ${payLabel(bill.payment_method)}<br>
            ${orderTypeLabel(bill.order_type) ? `<strong>Order:</strong> ${orderTypeLabel(bill.order_type)}<br>` : ''}
            <strong>Cashier:</strong> ${esc(bill.cashier_name || '-')}</p>
          </div>
          <div class="col-md-6 text-end">
            <span class="badge bg-${bill.status === 'completed' ? 'success' : (bill.status === 'refunded' ? 'warning text-dark' : 'danger')} fs-6">${bill.status.toUpperCase()}</span>
          </div>
        </div>
        ${bill.status === 'refunded' ? `
          <div class="alert alert-warning py-2 mb-3">
            <strong>Refunded</strong> by ${esc(bill.refunded_by_name || '-')} on ${formatDateTime(bill.refunded_at) || '-'}${bill.refund_approved_by_name && bill.refund_approved_by_name !== bill.refunded_by_name ? `, approved by ${esc(bill.refund_approved_by_name)}` : ''}<br>
            <strong>Reason:</strong> ${esc(bill.refund_reason || '-')}<br>
            <strong>Stock:</strong> ${bill.refund_restocked ? 'items were put back into stock' : 'items were NOT put back into stock'}
          </div>` : ''}
        <table class="table table-sm">
          <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
          <tbody>
            ${bill.items.map(i => `<tr><td>${esc(i.product_name)}</td><td>${i.quantity}</td><td>${formatCurrency(i.unit_price)}</td><td>${formatCurrency(i.total)}</td></tr>`).join('')}
          </tbody>
          <tfoot>
            <tr><td colspan="3" class="text-end">Subtotal</td><td>${formatCurrency(bill.subtotal)}</td></tr>
            ${bill.discount > 0 ? `<tr><td colspan="3" class="text-end">Discount</td><td>-${formatCurrency(bill.discount)}</td></tr>` : ''}
            ${bill.tax_amount > 0 ? `<tr><td colspan="3" class="text-end">Tax (${bill.tax_rate}%)</td><td>${formatCurrency(bill.tax_amount)}</td></tr>` : ''}
            <tr class="fw-bold"><td colspan="3" class="text-end">Total</td><td>${formatCurrency(bill.total)}</td></tr>
          </tfoot>
        </table>
        ${bill.refund_request ? `
          <div id="refund-request-box" class="alert alert-warning mt-3">
            <strong>Refund waiting for an admin.</strong>
            Asked by ${esc(bill.refund_request.user_name || '-')} at ${formatTime(bill.refund_request.created_at)}: &ldquo;${esc(bill.refund_request.reason)}&rdquo;
            &middot; ${bill.refund_request.restock ? 'items WILL be put back into stock' : 'items will NOT be put back into stock'}
            ${isAdmin() ? `
              <input class="form-control form-control-sm mt-2" data-role="note" placeholder="Note (needed to reject)">
              <div class="mt-2 d-flex gap-2"><button class="btn btn-sm btn-success" data-act="approve">Approve refund</button><button class="btn btn-sm btn-outline-danger" data-act="reject">Reject</button></div>`
            : `<div class="mt-2 d-flex gap-2"><button class="btn btn-sm btn-primary" id="btn-refund-admin-here">Admin: approve here</button>${currentUser && currentUser.id === bill.refund_request.user_id ? '<button class="btn btn-sm btn-outline-secondary" id="btn-refund-withdraw">Withdraw request</button>' : ''}</div>`}
          </div>` : ''}
        ${bill.status === 'completed' && !bill.refund_request ? `
          <div id="refund-panel" class="border border-danger rounded p-3 mt-3 d-none">
            <h6 class="fw-bold text-danger mb-2">Refund ${formatCurrency(bill.total)}</h6>
            <div class="mb-2">
              <label class="form-label" for="refund-reason">Reason (required)</label>
              <input type="text" class="form-control" id="refund-reason" placeholder="e.g., cake damaged, wrong order">
            </div>
            ${isPreorderBill(bill) ? `
              <div class="small text-muted mb-2">This bill came from collecting a pre-order. Collecting never took anything out of stock, so refunding it puts nothing back.</div>
            ` : `
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="refund-restock">
                <label class="form-check-label" for="refund-restock">Put items back into stock</label>
                <div class="text-muted" style="font-size:0.8rem;">Tick only if the items are going back on the shelf to be sold again. Leave it off for returned, damaged or eaten items.</div>
              </div>
            `}
            <button class="btn btn-danger" id="btn-refund-confirm">Confirm refund</button>
            <!-- A cashier's refund needs an admin: filled by askRefundApproval(). -->
            <div id="refund-approval" class="mt-3"></div>
          </div>` : ''}
      `;

      // A refund already waiting: the admin decides it here, or types their
      // password at this screen (the refund happens on approval).
      const reqBox = document.getElementById('refund-request-box');
      if (reqBox) {
        const reqId = bill.refund_request.id;
        const reload = async () => { bootstrap.Modal.getInstance(document.getElementById('billDetailModal')).hide(); await loadBills(); };
        const toast = (m, k) => showToast(esc(m), k === 'error' ? 'error' : 'success');
        if (isAdmin()) {
          Closing.wireRefundDecision(reqBox, reqId, null, reload, toast, withBusy);
        } else {
          document.getElementById('btn-refund-admin-here').onclick = async () => {
            const creds = await Closing.askAdmin('Admin approval — refund', `Refund bill #${String(bill.token_number).padStart(3,'0')} for ${formatCurrency(bill.total)}. The admin's password approves it and the bill is refunded.`);
            if (!creds) return;
            try {
              await api(`/api/pos/refund-requests/${Number(reqId)}/approve`, { method: 'POST', body: creds });
              showToast('Refund approved — the bill is refunded');
              await reload();
            } catch (err) { showToast(esc((err && err.message) || 'Could not approve'), 'error'); }
          };
          // The cashier who asked can take it back (nothing was refunded).
          const withdrawBtn = document.getElementById('btn-refund-withdraw');
          if (withdrawBtn) withdrawBtn.onclick = (e) => withBusy(e.currentTarget, async () => {
            await api(`/api/pos/refund-requests/${Number(reqId)}/cancel`, { method: 'POST', body: {} });
            showToast('Refund request withdrawn');
            await reload();
          }, 'Withdrawing...');
        }
      }

      const refundBtn = document.getElementById('btn-refund-bill');
      // The modal — and this button — is re-used for every bill, so clear any
      // busy state left over from a previous bill before re-wiring it.
      refundBtn.removeAttribute('data-busy');
      refundBtn.disabled = false;
      refundBtn.textContent = 'Refund Bill';
      if (bill.status === 'completed' && !bill.refund_request) {
        refundBtn.classList.remove('d-none');
        // The footer button only opens the refund panel in the modal body; the
        // panel's own button does the refund, after the reason and the restock
        // choice have been seen.
        refundBtn.onclick = () => {
          document.getElementById('refund-panel').classList.remove('d-none');
          document.getElementById('refund-reason').focus();
        };
        const confirmBtn = document.getElementById('btn-refund-confirm');
        confirmBtn.onclick = async () => {
          const trimmed = document.getElementById('refund-reason').value.trim();
          if (!trimmed) { showToast('Reason is required', 'error'); return; }
          const restockBox = document.getElementById('refund-restock');
          const restock = !!(restockBox && restockBox.checked);
          // A cashier's refund only becomes a request for an admin, so there is
          // nothing yet to warn about undoing; an admin's happens now.
          if (isAdmin() && !confirm(`Refund this bill for ${formatCurrency(bill.total)}?\n${restock ? 'The items WILL be put back into stock.' : 'The items will NOT be put back into stock.'}\nThis cannot be undone.`)) return;
          await withBusy(confirmBtn, async () => {
            await doRefund({ reason: trimmed, restock });
          }, 'Refunding...');
        };

        // The refund itself; `creds` is an admin's password typed in here.
        const doRefund = async (body, creds) => {
          let r;
          try {
            r = await api(`/api/pos/bills/${id}/refund`, { method: 'POST', body: { ...body, ...(creds || {}) } });
          } catch (err) {
            // A cashier's refund needs an admin: offer both ways, nothing changed yet.
            if (err && err.status === 409 && err.data && err.data.needs_approval) { askRefundApproval(body); return; }
            throw err;
          }
          showToast(r.restocked ? 'Bill refunded — items put back into stock' : 'Bill refunded — stock unchanged');
          // Servings from an opened box go back only to a box that is still open.
          if (r.portions && r.portions.not_returned > 0) {
            showToast('Some servings came from an opened box that is already finished, so they could not go back.', 'warning');
          }
          bootstrap.Modal.getInstance(document.getElementById('billDetailModal')).hide();
          await loadBills();
        };

        // Request the admin's approval (the refund happens when they approve),
        // or the admin types their password here and it happens now.
        const askRefundApproval = (body) => {
          const box = document.getElementById('refund-approval');
          box.innerHTML = `<div class="alert alert-warning mb-0">
            <strong>A refund needs an admin's approval.</strong>
            <div class="mt-2 d-flex gap-2 flex-wrap">
              <button class="btn btn-sm btn-primary" id="btn-refund-request">Request admin approval</button>
              <button class="btn btn-sm btn-outline-secondary" id="btn-refund-here">Admin: approve here</button>
            </div></div>`;
          document.getElementById('btn-refund-request').onclick = (e) => withBusy(e.currentTarget, async () => {
            await api(`/api/pos/bills/${id}/refund-requests`, { method: 'POST', body });
            showToast('Refund sent to the admin for approval');
            bootstrap.Modal.getInstance(document.getElementById('billDetailModal')).hide();
            await loadBills();
          }, 'Sending...');
          document.getElementById('btn-refund-here').onclick = async () => {
            const creds = await Closing.askAdmin('Admin approval — refund', `Refund bill #${String(bill.token_number).padStart(3,'0')} for ${formatCurrency(bill.total)}. The admin's password approves it and the bill is refunded now.`);
            if (!creds) return;
            try { await doRefund(body, creds); }
            catch (err) { showToast(esc((err && err.message) || 'Refund failed'), 'error'); }
          };
        };
      } else {
        refundBtn.classList.add('d-none');
      }

      const printOneSlip = async (text, withLogo) => {
        if (!text) { showToast('Nothing to print', 'warning'); return; }
        const w = window.open('', '_blank', 'width=350,height=700');
        const logoUrl = window.location.origin + '/public/img/kuki_logo.png';
        const logoHtml = withLogo ? `<img src="${logoUrl}" alt="KUKI">` : '';
        w.document.write(`
          <html><head><title></title><style>
            @page { size: 58mm auto; margin: 0; }
            html, body { margin: 0; padding: 0; width: 58mm; font-family: 'Consolas', 'Courier New', monospace; }
            .slip { padding: 0 0 2mm 0; width: 58mm; box-sizing: border-box; text-align: center; }
            .slip img { display: block; margin: 0 auto 2px; max-width: 45mm; max-height: 22mm; }
            .slip pre { font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.15; margin: 0; padding: 0 1mm; white-space: pre-wrap; text-align: left; }
          </style></head><body>
            <div class="slip">${logoHtml}<pre>${text}</pre></div>
          </body></html>
        `);
        w.document.close();
        const imgs = Array.from(w.document.images);
        await Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
        w.addEventListener('afterprint', () => setTimeout(() => { try { w.close(); } catch {} }, 200));
        w.print();
      };

      document.getElementById('btn-print-kitchen').onclick = async () => {
        const res = await api(`/api/pos/bills/${id}/receipt`);
        await printOneSlip(res.kitchen_text, false);
      };
      document.getElementById('btn-print-customer').onclick = async () => {
        const res = await api(`/api/pos/bills/${id}/receipt`);
        await printOneSlip(res.text, true);
      };

      new bootstrap.Modal(document.getElementById('billDetailModal')).show();
    }
  </script>
</body>
</html>
